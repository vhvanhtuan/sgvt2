<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PMS - Project Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./pms-style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <div id="pms-root"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <!-- Modals for editing -->
    <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Task</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="task-modal-form">
              <input type="hidden" name="id" />
              <div class="mb-3"><label class="form-label">Title</label><input name="title" class="form-control" required></div>
              <div class="mb-3"><label class="form-label">Project</label><select name="project_id" class="form-select"></select></div>
              <div class="mb-3"><label class="form-label">Assignee</label><select name="assignee_id" class="form-select"></select></div>
              <div class="mb-3"><label class="form-label">Status</label><select name="status" class="form-select"><option>todo</option><option>in_progress</option><option>done</option></select></div>
              <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control"></textarea></div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" id="task-modal-save" class="btn btn-primary">Save</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Project</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="project-modal-form">
              <input type="hidden" name="id" />
              <div class="mb-3"><label class="form-label">Title</label><input name="title" class="form-control" required></div>
              <div class="mb-3"><label class="form-label">Plan</label><select name="plan_id" class="form-select"></select></div>
              <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control"></textarea></div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" id="project-modal-save" class="btn btn-primary">Save</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="planModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Plan</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="plan-modal-form">
              <input type="hidden" name="id" />
              <div class="mb-3"><label class="form-label">Title</label><input name="title" class="form-control" required></div>
              <div class="mb-3"><label class="form-label">Start Date</label><input type="date" name="start_date" class="form-control" placeholder="YYYY-MM-DD"/></div>
              <div class="mb-3"><label class="form-label">End Date</label><input type="date" name="end_date" class="form-control" placeholder="YYYY-MM-DD"/></div>
              <div class="mb-3"><label class="form-label">Summary</label><textarea name="summary" class="form-control"></textarea></div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" id="plan-modal-save" class="btn btn-primary">Save</button>
          </div>
        </div>
      </div>
    </div>

    <script src="./pms-app.js"></script>
  </body>
</html>
