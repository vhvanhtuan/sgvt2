<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danh sách vé</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="cms.css" />
  <link rel="stylesheet" href="cargo.css" />
  <link rel="stylesheet" href="scroll-top.css" />
<link href="/html_logo.ico" rel="shortcut icon">
  <style>
    .filter-panel { background: #fff; border: 1px solid #d9dee6; border-radius: 10px; padding: 16px; margin-bottom: 18px; box-shadow: 0 1px 10px rgba(0,0,0,0.03); }
    .filter-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; align-items: end; }
    .table-card { background: #fff; border: 1px solid #d9dee6; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 10px rgba(0,0,0,0.03); }
    .table-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #e5e9ef; }
    .summary-box { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .summary-badge { background: #e7f1ff; color: #0d47a1; border-radius: 8px; padding: 10px 12px; font-size: 13px; min-width: 110px; font-weight: 500; }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
    .table-scroll::-webkit-scrollbar { height: 8px; }
    .table-scroll::-webkit-scrollbar-thumb { background: rgba(13, 110, 253, 0.35); border-radius: 999px; }
    .table-scroll::-webkit-scrollbar-track { background: transparent; }
    table.list-table { width: 100%; border-collapse: collapse; min-width: 1300px; }
    table.list-table th, table.list-table td { border-bottom: 1px solid #e7edf3; padding: 12px 10px; text-align: left; vertical-align: middle; }
    table.list-table th { background: #f8f9fa; color: #1f3f6c; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
    table.list-table tbody tr { transition: background-color 0.15s ease; }
    table.list-table tbody tr:hover { background: #f8fbff; }
    table.list-table tbody tr.selected { background: #e7f1ff; }
    table.list-table td small { color: #556f88; display: block; margin-top: 4px; }
    .pagination { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; padding: 14px 18px; }
    .pagination button { border: 1px solid #c4cdd7; background: #fff; padding: 8px 12px; border-radius: 6px; cursor: pointer; color: #1f3f6c; transition: all 0.15s ease; }
    .pagination button:hover { background: #f0f0f0; border-color: #999; }
    .pagination button.active { background: #0d6efd; color: #fff; border-color: #0d6efd; }
    .checkbox-center { text-align: center; }
    .text-right { text-align: right; }
    .empty-state { padding: 24px; text-align: center; color: #556f88; font-size: 16px; }
    @media (max-width: 768px) { .filter-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <div id="cms-header"></div>
  <script src="header-loader.js"></script>
  <div class="page-shell">
    <div class="page-title">
      <div>
        <h1>Danh sách vé</h1>
        <div class="status-pill">Danh sách vé ticket</div>
      </div>
      <div class="toolbar">
        <button id="btn-refresh" class="secondary"><i class="fa fa-sync"></i> Làm mới</button>
      </div>
    </div>

    <div class="filter-panel" style="display: none;">
      <div class="filter-grid">
        <div class="field-group" style="grid-column: span 3;">
          <label for="filter-search">Tìm kiếm</label>
          <input type="search" id="filter-search" class="form-control" placeholder="Mã vé, điện thoại, tên..." />
        </div>
        <div class="field-group" style="grid-column: span 2;">
          <label for="filter-status">Trạng thái</label>
          <select id="filter-status" class="form-select"></select>
        </div>
        <div class="field-group" style="grid-column: span 2;">
          <label for="filter-onboard">VP gửi</label>
          <select id="filter-onboard" class="form-select"></select>
        </div>
        <div class="field-group" style="grid-column: span 2;">
          <label for="filter-offboard">VP nhận</label>
          <select id="filter-offboard" class="form-select"></select>
        </div>
        <div class="field-group" style="grid-column: span 2;">
          <label for="filter-limit">Đơn/trang</label>
          <select id="filter-limit" class="form-select">
            <option value="15">15</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="100" selected>100</option>
          </select>
        </div>
        <div class="field-group" style="grid-column: span 1;">
          <button id="btn-filter" class="secondary" style="width:100%;">Lọc</button>
        </div>
        <div class="field-group" style="grid-column: span 1;">
          <button id="btn-reset-filter" class="secondary" style="width:100%;">Reset</button>
        </div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-actions">
        <div class="summary-box">
          <div class="summary-badge" id="summary-total">Tổng: 0 vé</div>
          <div class="summary-badge" id="summary-selected">Đã chọn: 0 vé</div>
          <div class="summary-badge" id="summary-selected-amount">Tổng tiền: 0 đ</div>
          <div class="summary-badge" id="summary-paid">Đã trả: 0 đ</div>
        </div>
        <div class="summary-box">
          <input type="checkbox" id="show-other-tickets" /> <label for="show-other-tickets">Hiện vé của người khác</label>
          <button id="btn-select-all" class="secondary hidden"><i class="fa fa-check-square"></i> Chọn tất cả trang</button>
          <button id="btn-clear-selection" class="secondary hidden"><i class="fa fa-ban"></i> Bỏ chọn</button>
        </div>
      </div>
      <div class="table-scroll">
        <table class="list-table" id="ticket-table">
          <thead>
            <tr>
              <th class="checkbox-center"><input type="checkbox" id="select-all-page" /></th>
              <th>Phơi</th>
              <th>Ghế</th>
              <th>SDT</th>
              <th>Tên khách</th>
              <th>Lên</th>
              <th>Xuống</th>
              <th>VND</th>
              <th>HTTT</th>
              <th>Mã vé</th>
              <th>Ghi chú</th>
              <th>Tạo lúc</th>
              <th>NV tạo</th>
              <th>Tại</th>
            </tr>
          </thead>
          <tbody id="ticket-table-body"></tbody>
        </table>
        <div id="ticket-empty" class="empty-state" style="display:none;">Không có vé phù hợp.</div>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <button id="scrollTopBtn" class="scroll-top-btn" type="button" title="Lên đầu trang">↑</button>
  <script src="scroll-top.js"></script>
  <script>
  const API_URL = '/api/cargo.php';
  const token = localStorage.getItem('cms_token') || localStorage.getItem('api_token') || '';
  if (!token) {
    window.location.href = 'cms-login.html';
  }

  const state = {
    rows: [],
    selected: {},
    page: 1,
    limit: 100,
    total: 0,
    filters: { q: '', status_id: '', onboard_at: '', offboard_at: '', show_other: 0 }
  };

  const elems = {
    search: document.getElementById('filter-search'),
    status: document.getElementById('filter-status'),
    onboardBranch: document.getElementById('filter-onboard'),
    offboardBranch: document.getElementById('filter-offboard'),
    limit: document.getElementById('filter-limit'),
    filterBtn: document.getElementById('btn-filter'),
    resetFilterBtn: document.getElementById('btn-reset-filter'),
    refreshBtn: document.getElementById('btn-refresh'),
    selectAllPage: document.getElementById('select-all-page'),
    selectAllButton: document.getElementById('btn-select-all'),
    showOtherTickets: document.getElementById('show-other-tickets'),
    clearSelectionButton: document.getElementById('btn-clear-selection'),
    summaryTotal: document.getElementById('summary-total'),
    summarySelected: document.getElementById('summary-selected'),
    summarySelectedAmount: document.getElementById('summary-selected-amount'),
    summaryPaid: document.getElementById('summary-paid'),
    tableBody: document.getElementById('ticket-table-body'),
    pagination: document.getElementById('pagination'),
    emptyState: document.getElementById('ticket-empty')
  };

  function redirectToLogin() {
    localStorage.removeItem('cms_token');
    localStorage.removeItem('api_token');
    window.location.href = 'cms-login.html';
  }

  function isAuthError(data, response) {
    if (response && (response.status === 401 || response.status === 403)) return true;
    const msg = data && data.message ? String(data.message) : '';
    return data && data.success === false && /invalid|expired|missing.*authorization|missing.*auth|access denied/i.test(msg);
  }

  async function requestJson(url, opts = {}) {
    const headers = opts.headers || {};
    headers['Authorization'] = 'Bearer ' + token;
    if (!opts.method || opts.method.toUpperCase() === 'GET') {
      headers['Accept'] = 'application/json';
    }
    if (opts.body && !opts.headers?.['Content-Type']) {
      headers['Content-Type'] = 'application/json';
    }
    const response = await fetch(url, Object.assign({ credentials: 'same-origin' }, opts, { headers }));
    const text = await response.text();
    let data;
    try { data = JSON.parse(text); } catch (err) { data = { success: false, message: 'Invalid response', raw: text }; }
    if (isAuthError(data, response)) {
      redirectToLogin();
      return data;
    }
    return data;
  }

  function formatCurrency(num) {
    const n = Number(num);
    if (!isFinite(n)) return '0';
    return n.toLocaleString('vi-VN');
  }

  function getFilterStorageKey() {
    return 'ticketListFilters2';
  }

  function saveFiltersToStorage() {
    const filterData = {
      q: elems.search.value.trim(),
      status_id: elems.status.value,
      onboard_at: elems.onboardBranch.value,
      offboard_at: elems.offboardBranch.value,
      show_other: elems.showOtherTickets.checked ? 1 : 0,
      limit: elems.limit.value,
      page: state.page
    };
    localStorage.setItem(getFilterStorageKey(), JSON.stringify(filterData));
  }

  function loadFiltersFromStorage() {
    const raw = localStorage.getItem(getFilterStorageKey());
    if (!raw) return;
    try {
      const saved = JSON.parse(raw);
      if (saved.q !== undefined) elems.search.value = saved.q;
      if (saved.status_id !== undefined) elems.status.value = saved.status_id;
      if (saved.onboard_at !== undefined) elems.onboardBranch.value = saved.onboard_at;
      if (saved.offboard_at !== undefined) elems.offboardBranch.value = saved.offboard_at;
      if (saved.show_other !== undefined) elems.showOtherTickets.checked = Number(saved.show_other) === 1;
      if (saved.limit !== undefined) elems.limit.value = saved.limit;
      if (saved.page !== undefined) state.page = Number(saved.page) || 1;
    } catch (err) {
      console.warn('Không thể đọc filter session', err);
    }
  }

  function resetFilters() {
    elems.search.value = '';
    elems.status.value = '';
    elems.onboardBranch.value = '';
    elems.offboardBranch.value = '';
    elems.showOtherTickets.checked = false;
    elems.limit.value = '100';
    state.page = 1;
    state.selected = {};
    saveFiltersToStorage();
    loadList(1);
  }

  function renderSummary() {
    elems.summaryTotal.textContent = `Tổng: ${formatNumberDisplay(state.total)} vé`;
    const selectedItems = Object.values(state.selected);
    const count = selectedItems.length;
    const sumTotal = selectedItems.reduce((s, row) => s + (Number(row.sum_vnd) || 0), 0);
    elems.summarySelected.textContent = `Đã chọn: ${count} vé`;
    elems.summarySelectedAmount.textContent = `Tổng tiền: ${formatCurrency(sumTotal)} đ`;
    elems.summaryPaid.textContent = `Đã trả: 0 đ`;
  }

  function buildRow(row) {
            // <br><small>ID:${row.id}</small>

    const checked = state.selected[String(row.id)] ? 'checked' : '';
    return `
      <tr class="${checked ? 'selected' : ''}">
        <td class="checkbox-center"><input type="checkbox" class="row-checkbox" data-id="${row.id}" ${checked} /></td>
        <td><a href="ticket-departure.html?route_id=${row.route_id}&dept_date=${row.dept_date}&dept_id=${row.dept_id}" class="text-decoration-underline">${row.route_name || ''} ${row.dept_date_time || ''}</a></td>
        <td>${row.seat_number || ''}</td>
        <td>${row.pass_mobile || ''}</td>
        <td>${row.pass_name || ''}</td>
        <td>${row.onboard_at || ''}</td>
        <td>${row.offboard_at || ''}</td>
        <td class="text-right">${formatNumberDisplay(row.ticket_vnd)} đ</td>
        <td>${row.payment || ''}</td>
        <td><strong>${row.random_code || row.ticket_code || row.id}</strong></td>
        <td>${row.notes || ''}</td>
        <td>${row.register_submit ? new Date(row.register_submit).toLocaleString('vi-VN') : ''}</td>
        <td>${row.first_name || ''}</td>
        <td>${row.branch_name || ''}</td>
      </tr>
    `;
  }

  function renderTable() {
    const html = state.rows.map(buildRow).join('');
    elems.tableBody.innerHTML = html;
    elems.emptyState.style.display = state.rows.length ? 'none' : 'block';
    Array.from(elems.tableBody.querySelectorAll('.row-checkbox')).forEach(cb => {
      cb.addEventListener('change', () => {
        const id = cb.dataset.id;
        const row = state.rows.find(r => String(r.id) === String(id));
        if (cb.checked) {
          state.selected[id] = row || { id };
        } else {
          delete state.selected[id];
        }
        cb.closest('tr')?.classList.toggle('selected', cb.checked);
        renderSummary();
      });
    });
    const allChecked = state.rows.length > 0 && state.rows.every(r => state.selected[String(r.id)]);
    elems.selectAllPage.checked = allChecked;
    renderPagination();
    renderSummary();
  }

  function renderPagination() {
    const totalPages = Math.max(1, Math.ceil((state.total || 0) / (state.limit || 1)));
    const current = Number(state.page) || 1;
    if (totalPages <= 1) {
      elems.pagination.innerHTML = '';
      return;
    }
    let start = Math.max(1, current - 3);
    let end = Math.min(totalPages, start + 6);
    if (end - start < 6) start = Math.max(1, end - 6);
    const parts = [];
    parts.push(`<button data-page="${Math.max(1, current - 1)}" ${current === 1 ? 'disabled' : ''}>‹</button>`);
    if (start > 1) parts.push(`<button data-page="1">1</button>`);
    if (start > 2) parts.push(`<span class="mx-2">…</span>`);
    for (let p = start; p <= end; p++) {
      parts.push(`<button data-page="${p}" class="${p === current ? 'active' : ''}">${p}</button>`);
    }
    if (end < totalPages - 1) parts.push(`<span class="mx-2">…</span>`);
    if (end < totalPages) parts.push(`<button data-page="${totalPages}">${totalPages}</button>`);
    parts.push(`<button data-page="${Math.min(totalPages, current + 1)}" ${current === totalPages ? 'disabled' : ''}>›</button>`);
    elems.pagination.innerHTML = parts.join('');
    Array.from(elems.pagination.querySelectorAll('button[data-page]')).forEach(btn => {
      btn.addEventListener('click', () => {
        const p = Number(btn.getAttribute('data-page')) || 1;
        if (p === current) return;
        loadList(p);
      });
    });
  }

  function buildListParams(page) {
    const params = new URLSearchParams();
    params.set('action', 'get_tickets');
    params.set('page', page);
    params.set('limit', state.limit || 30);
    if (state.filters.q) params.set('q', state.filters.q);
    if (state.filters.status_id) params.set('status_id', state.filters.status_id);
    if (state.filters.onboard_at) params.set('onboard_at', state.filters.onboard_at);
    if (state.filters.offboard_at) params.set('offboard_at', state.filters.offboard_at);
    params.set('show_other', state.filters.show_other ? 1 : 0);
    return params;
  }

  async function loadMeta() {
    const data = await requestJson(`${API_URL}?action=meta`);
    if (!data || !data.success) {
      return;
    }
    const opts = data.options || {};
    elems.status.innerHTML = '<option value="">-- Tất cả trạng thái --</option>' + (opts.statuses || []).map(item => `<option value="${item.id}">${item.label}</option>`).join('');
    const branchOptions = '<option value="">-- Tất cả VP --</option>' + (opts.branches || []).map(item => `<option value="${item.id}">${item.label}</option>`).join('');
    elems.onboardBranch.innerHTML = branchOptions;
    elems.offboardBranch.innerHTML = branchOptions;
  }

      async function checkTicketsChanged() {
      try {
        const params = buildListParams(state.page);
        params.set('get_hash', '1');
        const data = await requestJson(`${API_URL}?${params.toString()}`);
        // robust extraction of hash from possible response shapes
        let serverHash = null;
        serverHash = data?data.data_hash:null;
        const key = 'td_ticket_list_hash';
        const localHash = localStorage.getItem(key) || null;
        if (serverHash && serverHash !== localHash) {
          await loadList(state.page);
        }
      } catch (err) {
        console.error('checkTicketsChanged error', err);
      }
    }

  async function loadList(page = 1) {
    state.page = page;
    state.limit = Number(elems.limit.value) || 30;
    state.filters.q = elems.search.value.trim();
    state.filters.status_id = elems.status.value;
    state.filters.onboard_at = elems.onboardBranch.value;
    state.filters.offboard_at = elems.offboardBranch.value;
    state.filters.show_other = elems.showOtherTickets.checked ? 1 : 0;
    saveFiltersToStorage();
    const params = buildListParams(state.page);
    const data = await requestJson(`${API_URL}?${params.toString()}`);
    if (!data || !data.success) {
      alert(data?.message || 'Không tải được danh sách vé.');
      return;
    }
    
      try {
      const serverHash = data.data_hash || null;
      if (serverHash) {
      try { localStorage.setItem('td_ticket_list_hash', String(serverHash)); } catch (e) { /* ignore */ }
      }
      } catch (err) { /* ignore */ }

  state.rows = data.data || [];
    state.total = Number(data.total) || 0;
    renderTable();
  }

  elems.filterBtn.addEventListener('click', () => loadList(1));
  elems.search.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      event.preventDefault();
      loadList(1);
    }
  });
  elems.resetFilterBtn.addEventListener('click', resetFilters);
  elems.refreshBtn.addEventListener('click', () => loadList(state.page));
  elems.limit.addEventListener('change', () => loadList(1));
  elems.selectAllButton.addEventListener('click', () => {
    state.rows.forEach(row => { state.selected[String(row.id)] = row; });
    renderTable();
  });
  elems.clearSelectionButton.addEventListener('click', () => {
    state.selected = {};
    renderTable();
  });
  elems.selectAllPage.addEventListener('change', () => {
    const checked = elems.selectAllPage.checked;
    if (checked) {
      state.rows.forEach(row => { state.selected[String(row.id)] = row; });
    } else {
      state.rows.forEach(row => { delete state.selected[String(row.id)]; });
    }
    renderTable();
  });
  elems.showOtherTickets.addEventListener('change', () => {
    loadList(1);
  });

  (async function init() {
    await loadMeta();
    loadFiltersFromStorage();
    await loadList(state.page);

          // start periodic check for ticket changes (every 5 seconds)
      try {
        if (window.td_check_interval) clearInterval(window.td_check_interval);
        window.td_check_interval = setInterval(() => {
          try { checkTicketsChanged(); } catch (e) { console.error('td check error', e); }
        }, 5000);
      } catch (e) { console.error('start check interval error', e); }
      // clear interval on unload
      window.addEventListener('beforeunload', () => {
        if (window.td_check_interval) clearInterval(window.td_check_interval);
      });

  })();
  </script>
</body>
</html>
