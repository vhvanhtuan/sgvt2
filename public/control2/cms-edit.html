<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CMS Edit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cms.css">
    <link rel="stylesheet" href="scroll-top.css">
    <link rel="stylesheet" href="cms-chat.css">
    <!-- Select2 + Bootstrap 5 theme (for large selects) -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/gh/apalfrey/select2-bootstrap-5-theme@latest/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="/html_logo.ico" rel="shortcut icon">

        .cms-form-group label { padding-right: 10px; }
        .cms-form-group label:nth-of-type(3n+1) { color: red; }
        .cms-form-group label:nth-of-type(3n+2) { color: rgb(25, 0, 255); }
        .cms-form-group label:nth-of-type(3n+3) { color: rgb(9, 80, 0); }

        .cms-field-wrap { display: inline-block; vertical-align: top; box-sizing: border-box; padding-right: 6px; }

        .cms-recalc-wrap { width: 100%; flex: 0 0 100%; margin-top: 8px; margin-bottom: 8px; }
        .cms-recalc-btn { min-width: 140px; }
        #cms-edit-form textarea { min-height: 140px; }
    </style>
</head>
<body>

            <div id="cms-shortcuts" style="margin-right:12px"></div>

            <div id="cms-debug-toggle" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer;user-select:none" onclick="var b=document.getElementById('cms-debug-body');if(!b)return;b.style.display=b.style.display==='none'?'block':'none'">
                <strong style="color:#c00">&#128269; DEBUG - Đối chiếu quyền</strong>
                <button type="button" onclick="event.stopPropagation(); loadDebugPerm()" style="padding:3px 10px;font-size:12px;cursor:pointer">&#8635; Tải</button>
                <span style="color:#888;font-size:11px">[Xóa panel này khi xong debug]</span>
            </div>

                <div id="cms-debug-token" style="margin-bottom:8px"></div>
                <div id="cms-debug-content" style="color:#666">-- Đang tải... --</div>

        <div class="cms-form-actions cms-form-actions-top">
            <button type="button" class="cms-save-btn" data-role="save">Lưu</button>
            <button type="button" class="cms-btn-back" data-role="back">Quay lại</button>
        </div>
        <form id="cms-edit-form"></form>
        <div class="cms-form-actions">
            <button type="button" class="cms-save-btn" data-role="save">Lưu</button>
            <button type="button" class="cms-btn-back" data-role="back">Quay lại</button>
        </div>
    </div>
    <button id="scrollTopBtn" class="scroll-top-btn" type="button" title="Lên đầu trang">↑</button>
    <div id="cms-toast-container" class="toast-container position-fixed" aria-live="polite" aria-atomic="true"></div>
        <!-- jQuery and Select2 (used for enhancing large select fields) -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
        <script src="cms-help.js"></script>
        <script src="cms-top-menu.js"></script>
        <script src="scroll-top.js"></script>
        <script>
        const token = localStorage.getItem('cms_token');
        if (!token) window.location.href = 'cms-login.html';

        // Load user menus (shortcuts) into #cms-shortcuts
        (async function loadUserMenus(){
            try {
                if (window.renderCmsTopMenu) {
                    await window.renderCmsTopMenu(document.getElementById('cms-shortcuts'));
                }
                try { await initCmsHelp(token); } catch (e) {}
                try { initFieldWidthSelector(); } catch (e) {}
            } catch (e) { /* ignore */ }
        })();

        // hàm reload trang
        function reloadPage() {
            window.location.reload();
        }

        // Field width selector: create select and append to #cms-shortcuts
        function initFieldWidthSelector() {
            const container = document.getElementById('cms-shortcuts');
            if (!container) return;
            // Avoid duplicate
            if (document.getElementById('cms-field-width-select')) return;
            const sel = document.createElement('select');
            sel.id = 'cms-field-width-select';
            sel.title = 'Chọn số cột / chiều ngang field';
            sel.style.marginLeft = '8px';
            sel.style.padding = '4px';
            sel.style.width = '40px';
            const opts = [ {label: '0', value: ''}, {label: '1', value: '99'}, {label: '2', value: '49'}, {label: '3', value: '32.3'}, {label: '4', value: '24'}, {label: '5', value: '19'} ];
            opts.forEach(o => {
                const op = document.createElement('option');
                op.value = String(o.value);
                op.text = String(o.label);
                sel.appendChild(op);
            });
            // restore stored value (percent)
            const stored = localStorage.getItem('cms_field_wrap_percent');
            if (stored) {
                // if there's a matching option select it, else add a custom option
                const match = Array.from(sel.options).some(o => o.value === stored);
                if (!match) {
                    const custom = document.createElement('option');
                    custom.value = stored;
                    custom.text = stored + '%';
                    sel.appendChild(custom);
                }
                sel.value = stored;
            } else {
                sel.value = '100';
            }
            sel.addEventListener('change', function() {
                localStorage.setItem('cms_field_wrap_percent', this.value);
                applyFieldWrapWidth();
            });
            container.appendChild(sel);
        }

        // Apply stored width to all .cms-field-wrap elements (skip fields with fixed metadata width)
        function applyFieldWrapWidth() {
            const stored = localStorage.getItem('cms_field_wrap_percent');
            const els = document.querySelectorAll('.cms-field-wrap');
            els.forEach(el => {
                try {
                    if (el.dataset.fixedWidth === '1') return; // respect field-specific width
                    if (stored && stored.trim() !== '') el.style.width = stored + '%';
                    else el.style.width = '';
                } catch (e) {}
            });
        }

        function escapeRegExp(value) {
            return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function parseFormulas(formulaText) {
            if (!formulaText || !String(formulaText).trim()) return [];
            return String(formulaText)
                .split(/\r?\n|;/)
                .map(line => line.trim())
                .filter(line => line !== '')
                .map(line => {
                    const formula = { text: line, type: 'assignment', target: null, expr: null, condition: null, fields: [], func: null, funcCode: null, fieldString: null };
                    const ifMatch = line.match(/^\s*if\s*\(([^)]+)\)\s*(.+)$/i);
                    if (ifMatch) {
                        formula.type = 'conditional';
                        formula.condition = ifMatch[1].trim();
                        line = ifMatch[2].trim();
                    }
                    
                    // Detect: function('CODE', 'field1, field2, ...')
                    const fnCallMatch = line.match(/^\s*function\s*\(\s*['"]([^'"]+)['"]\s*,\s*['"]([^'"]*)['"]\s*\)\s*$/);
                    if (fnCallMatch) {
                        formula.type = 'function';
                        formula.func = fnCallMatch[1]; // function code like 'A03BCF'
                        formula.funcCode = fnCallMatch[1];
                        formula.fieldString = fnCallMatch[2]; // field list like 'tong_km, tong_vnd'
                        // Parse field list to array
                        formula.fields = (fnCallMatch[2] || '')
                            .split(',')
                            .map(s => s.trim())
                            .filter(s => s !== '');
                        return formula;
                    }
                    
                    const assignMatch = line.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*([\s\S]+)$/);
                    if (!assignMatch) return null;
                    formula.target = assignMatch[1];
                    formula.expr = assignMatch[2].trim();
                    return formula;
                })
                .filter(item => item);
        }

        function getFieldValueForFormula(fieldName) {
            const els = Array.from(document.getElementsByName(fieldName));
            if (!els.length) return '';
            const first = els[0];
            if (first.type === 'checkbox') {
                const checkboxes = els.filter(el => el.type === 'checkbox');
                if (checkboxes.length === 1) {
                    return checkboxes[0].checked ? (checkboxes[0].value || '1') : '0';
                }
                return checkboxes.filter(el => el.checked).map(el => el.value).join(',');
            }
            if (first.type === 'radio') {
                const checked = els.find(el => el.checked);
                return checked ? checked.value : '';
            }
            return first.value;
        }

        function evaluateFormulaExpression(expr, values) {
            let expression = String(expr);
            Object.keys(values).forEach(name => {
                const raw = values[name];
                const number = parseFloat(String(raw).replace(/[\s,]/g, ''));
                const replacement = Number.isFinite(number) ? String(number) : '0';
                const regex = new RegExp('\\b' + escapeRegExp(name) + '\\b', 'g');
                expression = expression.replace(regex, replacement);
            });
            expression = expression.replace(/,/g, '.');
            try {
                return Function('return ' + expression)();
            } catch (err) {
                return null;
            }
        }

        function bindFormulaInputs() {
            if (!Array.isArray(window.cmsFormulas) || window.cmsFormulas.length === 0) return;
            const fieldNames = new Set();
            window.cmsFormulas.forEach(formula => {
                if (formula.type === 'function') {
                    // For function formulas, fields are already parsed into formula.fields
                    (formula.fields || []).forEach(name => fieldNames.add(name));
                } else {
                    // For math/assignment formulas, extract field names from expression
                    formula.fields.forEach(name => fieldNames.add(name));
                }
            });
            fieldNames.forEach(name => {
                const els = Array.from(document.getElementsByName(name));
                els.forEach(el => {
                    const eventName = (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'radio') ? 'change' : 'input';
                    el.addEventListener(eventName, () => {
                        recomputeFormulas();
                    });
                });
            });
        }

        function recomputeFormulas(options = {}) {
            const skipRemoteFunctions = !!(options && options.skipRemoteFunctions);
            if (!Array.isArray(window.cmsFormulas) || window.cmsFormulas.length === 0) return;
            for (let pass = 0; pass < 5; pass++) {
                let anyChanged = false;
                window.cmsFormulas.forEach(formula => {
                    try {
                        // Handle remote function call formulas
                        if (formula.type === 'function' && formula.funcCode && formula.fields) {
                            if (skipRemoteFunctions) return;
                            // Build a key from current field values to detect changes
                            const values = {};
                            (formula.fields || []).forEach(name => {
                                values[name] = getFieldValueForFormula(name);
                            });
                            const valuesKey = JSON.stringify(values);
                            if (formula._lastValuesKey === valuesKey) return; // no change
                            
                            // Detect which field changed by comparing with previous values
                            let changedField = '';
                            if (formula._lastValues) {
                                (formula.fields || []).forEach(fname => {
                                    if (formula._lastValues[fname] !== values[fname]) {
                                        changedField = fname; // Last changed field
                                    }
                                });
                            }
                            
                            // Store current values for next comparison
                            formula._lastValues = Object.assign({}, values);
                            formula._lastValuesKey = valuesKey;
                            formula._changedField = changedField;
                            callPmsFunction(formula.funcCode, formula.fields, formula).catch(() => {});
                            return;
                        }
                        
                        // Handle math/assignment formulas
                        const values = {};
                        formula.fields.forEach(name => {
                            values[name] = getFieldValueForFormula(name);
                        });
                        if (formula.type === 'conditional') {
                            const conditionResult = evaluateFormulaExpression(formula.condition, values);
                            if (!conditionResult) return;
                        }
                        const result = evaluateFormulaExpression(formula.expr, values);
                        const newValue = (result === null || result === undefined || Number.isNaN(result)) ? '' : String(result);
                        const targets = Array.from(document.getElementsByName(formula.target));
                        targets.forEach(target => {
                            const finalValue = target.dataset && target.dataset.numberField === '1' ? formatNumberString(newValue) : newValue;
                            if (target.value !== finalValue) {
                                target.value = finalValue;
                                anyChanged = true;
                            }
                        });
                    } catch (e) {
                        // ignore errors
                    }
                });
                if (!anyChanged) break;
            }
        }

        async function gatherFormData() {
            const payload = {};
            try {
                const form = document.getElementById('cms-edit-form');
                if (!form) return payload;

                const els = Array.from(form.querySelectorAll('[data-field], [name^="child_"]'))
                    .filter(el => !el.disabled);
                const groups = new Map();
                els.forEach(el => {
                    const name = el.name || el.getAttribute('name');
                    if (!name) return;
                    if (!groups.has(name)) groups.set(name, []);
                    groups.get(name).push(el);
                });

                groups.forEach((controls, name) => {
                    if (!controls || controls.length === 0) return;
                    const first = controls[0];

                    if (first.type === 'checkbox') {
                        if (controls.length === 1) {
                            payload[name] = first.checked ? (first.value || '1') : '0';
                        } else {
                            payload[name] = controls.filter(node => node.checked).map(node => node.value);
                        }
                        return;
                    }

                    if (first.type === 'radio') {
                        const checked = controls.find(node => node.checked);
                        payload[name] = checked ? checked.value : '';
                        return;
                    }

                    if (first.tagName === 'SELECT' && first.multiple) {
                        payload[name] = Array.from(first.selectedOptions).map(o => o.value);
                        return;
                    }

                    if (name.indexOf('child_') === 0) {
                        payload[name] = controls.map(node => node.value);
                        return;
                    }

                    payload[name] = first.value;
                });
            } catch (e) {}
            return payload;
        }

        async function callPmsFunction(funcCode, fieldList, formula) {
            if (!table) return;
            if (formula._calling) return;
            formula._calling = true;
            try {
                await ensureChildTablesReady();
                const formData = await gatherFormData();
                
                // Get which field changed from formula metadata
                const changedField = formula._changedField || '';
                
                const body = { 
                    function: funcCode, 
                    args: fieldList,
                    form: formData, 
                    id: isNew ? 'new' : id,
                    field_changed: changedField
                };
                let url = '/api/generic.php?action=do_pms_function&function=' + encodeURIComponent(funcCode) + '&table=' + encodeURIComponent(table);
                if (changedField) {
                    url += '&field_changed=' + encodeURIComponent(changedField);
                }
                
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify(body)
                });
                const jr = await res.json();
                if (jr && typeof jr === 'object') {
                    const data = jr.data || {};
                    const calc_message = jr.calc_message || '';
                    if (data && typeof data === 'object') {
                        Object.keys(data).forEach(k => {
                            try {
                                const targets = [];
                                const targetById = document.getElementById(k);
                                if (targetById) {
                                    targets.push(targetById);
                                }
                                Array.from(document.getElementsByName(k)).forEach(target => {
                                    if (!targets.includes(target)) {
                                        targets.push(target);
                                    }
                                });
                                targets.forEach(target => {
                                    const val = data[k] === null || data[k] === undefined ? '' : String(data[k]);
                                    const finalValue = (target.dataset && target.dataset.numberField === '1') ? formatNumberString(val) : val;
                                    if (target.value !== finalValue) {
                                        target.value = finalValue;
                                        try {
                                            const evt = new Event('input', { bubbles: true });
                                            target.dispatchEvent(evt);
                                            const evt2 = new Event('change', { bubbles: true });
                                            target.dispatchEvent(evt2);
                                        } catch (e) {}
                                    }
                                });
                            } catch (e) {}
                        });
                        try { recomputeFormulas(); } catch (e) {}
                    }
                    if(calc_message) alert(calc_message);
                    
                    // Xử lý call_functions - thực hiện các function JavaScript từ backend
                    if(jr.call_functions && typeof jr.call_functions === 'string') {
                        const functionCalls = jr.call_functions
                            .split(';')
                            .map(fn => fn.trim())
                            .filter(fn => fn.length > 0);
                        
                        for(const fnCall of functionCalls) {
                            try {
                                // Kiểm tra nếu là function call có tham số (eg: fnName(arg1, arg2))
                                // hay chỉ là function name (eg: fnName)
                                if(typeof window[fnCall] === 'function') {
                                    window[fnCall]();
                                } else if(fnCall.includes('(')) {
                                    // Thực hiện như function call: eval() hoặc Function()
                                    new Function(fnCall)();
                                }
                            } catch(e) {
                                console.error('Error calling function:', fnCall, e);
                            }
                        }
                    }
                }
            } catch (e) {
            } finally {
                formula._calling = false;
            }
        }

        function getFunctionFormulas() {
            if (!Array.isArray(window.cmsFormulas)) return [];
            return window.cmsFormulas.filter(formula => formula && formula.type === 'function' && formula.funcCode);
        }

        function getMetaExtraObjects() {
            const sources = [
                meta && meta.extra,
                meta && meta.table_extra,
                meta && meta.table_names_extra,
                meta && meta.table_config,
                meta && meta.child_tables,
                meta && meta.children,
                meta && meta.table_children
            ];
            const objects = [];
            sources.forEach(source => {
                if (source === null || source === undefined) return;
                const raw = typeof source === 'string' ? parseJsonLoose(source) : source;
                if (raw && typeof raw === 'object') {
                    objects.push(raw);
                }
            });
            return objects;
        }

        function getObjectValueIgnoreCase(source, candidateKeys) {
            if (!source || typeof source !== 'object' || Array.isArray(source)) return undefined;
            const entries = Object.entries(source);
            for (const candidateKey of (candidateKeys || [])) {
                const found = entries.find(([key]) => String(key || '').trim().toLowerCase() === String(candidateKey || '').trim().toLowerCase());
                if (found) return found[1];
            }
            return undefined;
        }

        function normalizeCustomActionButton(raw, fallbackIndex = 0) {
            if (!raw) return null;
            if (typeof raw === 'string') {
                const text = String(raw).trim();
                return text ? { label: text, function_code: text } : null;
            }
            if (typeof raw !== 'object' || Array.isArray(raw)) return null;

            const labelKeys = ['label', 'name', 'title', 'text', 'button_label', 'button_text', 'button'];
            const functionKeys = ['function', 'func', 'function_code', 'code', 'value', 'pms_function', 'action'];
            let label = '';
            let functionCode = '';

            for (const key of labelKeys) {
                const value = raw[key];
                if (value !== undefined && value !== null && String(value).trim() !== '') {
                    label = String(value).trim();
                    break;
                }
            }
            for (const key of functionKeys) {
                const value = raw[key];
                if (value !== undefined && value !== null && String(value).trim() !== '') {
                    functionCode = String(value).trim();
                    break;
                }
            }

            if (!functionCode) {
                const entries = Object.entries(raw).filter(([key, value]) => {
                    return key && value !== undefined && value !== null && String(value).trim() !== '';
                });
                if (entries.length === 1) {
                    const [entryKey, entryValue] = entries[0];
                    if (typeof entryValue === 'string') {
                        label = entryKey;
                        functionCode = entryValue.trim();
                    }
                }
            }

            if (!functionCode) return null;
            return {
                label: label || functionCode,
                function_code: functionCode
            };
        }

        function getCustomActionButtonsFromMeta() {
            const collectButtons = (source) => {
                if (!source) return [];
                if (Array.isArray(source)) {
                    const result = [];
                    source.forEach((entry, index) => {
                        if (!entry) return;
                        if (typeof entry === 'string') {
                            const button = normalizeCustomActionButton(entry, index);
                            if (button) result.push(button);
                            return;
                        }
                        if (typeof entry === 'object' && !Array.isArray(entry)) {
                            const directButton = normalizeCustomActionButton(entry, index);
                            if (directButton) {
                                result.push(directButton);
                                return;
                            }
                            Object.entries(entry).forEach(([key, value]) => {
                                if (value === undefined || value === null || String(value).trim() === '') return;
                                const button = normalizeCustomActionButton({ label: key, function: value }, index);
                                if (button) result.push(button);
                            });
                        }
                    });
                    return result;
                }
                if (typeof source === 'object') {
                    const result = [];
                    Object.entries(source).forEach(([key, value]) => {
                        if (value === undefined || value === null || String(value).trim() === '') return;
                        if (typeof value === 'object' && !Array.isArray(value)) {
                            const directButton = normalizeCustomActionButton({ label: key, ...value });
                            if (directButton) result.push(directButton);
                            return;
                        }
                        const button = normalizeCustomActionButton({ label: key, function: value });
                        if (button) result.push(button);
                    });
                    return result;
                }
                const button = normalizeCustomActionButton(source, 0);
                return button ? [button] : [];
            };

            const buttonKeys = ['buttons', 'custom_buttons', 'action_buttons', 'pms_buttons'];
            const extras = getMetaExtraObjects();
            const allButtons = [];

            extras.forEach(extra => {
                const rawButtons = getObjectValueIgnoreCase(extra, buttonKeys);
                if (rawButtons) {
                    allButtons.push(...collectButtons(rawButtons));
                }
            });

            const deduped = [];
            const seen = new Set();
            allButtons.forEach(button => {
                if (!button || !button.function_code) return;
                const dedupeKey = String(button.label || '') + '|' + String(button.function_code || '');
                if (seen.has(dedupeKey)) return;
                seen.add(dedupeKey);
                deduped.push(button);
            });

            return deduped;
        }

        async function triggerCustomPmsFunction(functionCode, buttonConfig) {
            if (!functionCode || !table) return;
            const fieldList = (meta && Array.isArray(meta.fields) ? meta.fields : [])
                .filter(field => field && field.name && field.show_form !== false)
                .map(field => field.name)
                .filter(Boolean);
            await callPmsFunction(functionCode, fieldList, {
                _calling: false,
                _changedField: ''
            });
        }

        function createRecalculateBlock(customButtons = [], hasRemotePmsFunction = false) {
            const wrap = document.createElement('div');
            wrap.className = 'cms-recalc-wrap';
            wrap.id = 'cms-recalculate-wrap';
            wrap.style.display = 'flex';
            wrap.style.gap = '8px';
            wrap.style.flexWrap = 'wrap';
            wrap.style.marginTop = '12px';

            if (hasRemotePmsFunction) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.id = 'cms-recalculate-btn';
                btn.className = 'cms-btn cms-recalc-btn tinh-toan-lai-btn';
                btn.innerText = 'Tính toán lại';
                btn.addEventListener('click', () => {
                    triggerRecalculateFunctions().catch(() => {});
                });
                wrap.appendChild(btn);
            }

            (customButtons || []).forEach(buttonConfig => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'cms-btn cms-action-btn';

        function formatNumberString(value) {
            let raw = String(value || '');
            raw = raw.replace(/[^0-9.,]/g, '');
            raw = raw.replace(/,/g, '');
            if (raw === '' || raw === '-' || raw === '.' || raw === '-.') {
                return raw;
            }
            const parts = raw.split('.');
            const intPart = parts[0].replace(/\D/g, '').replace(/^0+(?=\d)/, '');
            const decimals = parts.slice(1).join('').replace(/[^0-9]/g, '');
            const formattedInt = intPart ? intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : '0';
            return formattedInt + (decimals ? '.' + decimals : '');
        }

        function parseNumericValue(value) {
            if (value === undefined || value === null) return '';
            let raw = String(value).replace(/[^0-9.,]/g, '').replace(/,/g, '');
            const parts = raw.split('.');
            if (parts.length <= 1) return raw;
            return parts.shift() + '.' + parts.join('').replace(/\./g, '');

                // Also handle shorthand attributes like "disabled" or "readonly"
                const attrRegex = /(\w+)(?:=(?:"([^"]*)"|'([^']*)'|(\S+)))?/g;
                let match;
                while ((match = attrRegex.exec(extra)) !== null) {
                    const attrName = match[1];
                    const attrValue = match[2] || match[3] || match[4] || ''; // pick whichever group matched
                    if (attrName === 'style' && attrValue) {
                        // For style, merge with existing inline styles
                        const existing = element.getAttribute('style') || '';
                        element.setAttribute('style', existing + (existing && !existing.endsWith(';') ? '; ' : '') + attrValue);
                    } else if (attrName === 'class' && attrValue) {
                        // For class, add to existing classes
                        element.classList.add(...attrValue.split(/\s+/).filter(Boolean));
                    } else if (!attrValue) {
                        // Shorthand boolean attributes
                        element.setAttribute(attrName, '');
                    } else {
                        // Regular attribute
                        element.setAttribute(attrName, attrValue);

        function isTruthyMetaFlag(value) {

        function hasTruthyAttributeFlag(source, attrName) {
            const text = String(source || '').trim();
            const name = String(attrName || '').trim();
            if (!text || !name) return false;

            const escapedName = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const attrRegex = new RegExp(`(?:^|\\s)${escapedName}(?:\\s*=\\s*(?:"([^"]*)"|'([^']*)'|([^\\s]+)))?(?=\\s|$)`, 'i');
            const match = text.match(attrRegex);
            if (!match) return false;

            const rawValue = match[1] ?? match[2] ?? match[3];
            return rawValue === undefined ? true : isTruthyMetaFlag(rawValue);
        }

        function hasKeywordFlag(source, keyword) {
            const text = String(source || '').trim();
            const key = String(keyword || '').trim().toLowerCase();
            if (!text || !key) return false;
            return text

        function hasSelect2Extra(extraStr) {

            const attrMatch = extraText.match(/(?:^|\s)select2(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s]+)))?(?=\s|$)/i);
            if (attrMatch) {
                const rawValue = attrMatch[1] ?? attrMatch[2] ?? attrMatch[3];

        function normalizeChildColumn(col) {
            if (!col || typeof col !== 'object') return null;

            const hasReadonlyProp = Object.prototype.hasOwnProperty.call(col, 'readonly')

            const readonlyRaw = hasReadonlyProp
                ? (col.readonly !== undefined ? col.readonly : col.readOnly)

            const extra = String(col.extra || '').trim();

                    if (stringValue === '') continue;
                    const escapedName = typeof CSS !== 'undefined' && typeof CSS.escape === 'function'
                        ? CSS.escape(name)
                        : name.replace(/"/g, '\\"');
                    const controls = Array.from(form.querySelectorAll('[name="' + escapedName + '"]'));
                    if (!controls.length) continue;

                    const first = controls[0];
                    let currentValue = '';
                    if (first.tagName === 'SELECT') {
                        currentValue = String(first.value || '').trim();
                    } else if (first.type === 'radio') {
                        const checked = controls.find(c => c.checked);
                        currentValue = checked ? String(checked.value || '').trim() : '';
                    } else if (first.type === 'checkbox') {
                        if (controls.length === 1) {
                            currentValue = first.checked ? String(first.value || '').trim() : '';
                        } else {
                            currentValue = controls.filter(c => c.checked).map(c => String(c.value || '').trim()).join(',');

        function getFieldSelectedValues(fieldName) {

                const text = String(rawVal).trim();
                if (!text) return [];
                if (text.startsWith('[') && text.endsWith(']')) {
                    try {
                        const arr = JSON.parse(text);
                        if (Array.isArray(arr)) return arr.map(v => String(v));
                    } catch (_) {}
                }
                return text.split(',').map(s => s.trim()).filter(Boolean);
            };

            if (!form) return parseValues(record && record[fieldName]);
            const named = Array.from(form.querySelectorAll(`[name="${fieldName}"]`));
            if (!named.length) return parseValues(record && record[fieldName]);

            if (named[0].tagName === 'SELECT') {
                const selected = String(named[0].value ?? '');
                if (selected !== '') return [selected];
                return parseValues(record && record[fieldName]);
            }
            if (named[0].type === 'radio') {
                const checked = named.find(node => node.checked);

            if (named[0].type === 'checkbox') {
                const checkedVals = named.filter(node => node.checked).map(node => String(node.value ?? ''));
                if (checkedVals.length > 0) return checkedVals;
                return parseValues(record && record[fieldName]);
            }
            return [String(named[0].value ?? '')];
        }

        function buildDynamicOptionControl(fieldMeta, renderType, options, selectedValues) {
            const type = String(renderType || 'select').toLowerCase();
            const selectedSet = new Set((selectedValues || []).map(v => String(v)));

            if (type === 'checkbox') {
                const wrap = document.createElement('div');
                wrap.setAttribute('data-field-control', '1');
                options.forEach(opt => {
                    const value = String(opt.value ?? '');
                    const line = document.createElement('label');
                    line.style.display = 'inline-flex';
                    line.style.alignItems = 'center';
                    line.style.marginRight = '14px';
                    line.style.marginBottom = '6px';

                    const chk = document.createElement('input');
                    chk.type = 'checkbox';
                    chk.name = fieldMeta.name;
                    chk.dataset.field = fieldMeta.name;
                    chk.value = value;
                    chk.checked = selectedSet.has(value);
                    applyExtraAttributes(chk, fieldMeta.extra);

                    const txt = document.createElement('span');
                    txt.innerText = ' ' + String(opt.label ?? value);

                    line.appendChild(chk);
                    line.appendChild(txt);
                    wrap.appendChild(line);
                });
                return wrap;
            }

            if (type === 'radio') {
                const wrap = document.createElement('div');
                wrap.setAttribute('data-field-control', '1');
                options.forEach(opt => {
                    const value = String(opt.value ?? '');
                    const line = document.createElement('label');
                    line.style.display = 'inline-flex';
                    line.style.alignItems = 'center';
                    line.style.marginRight = '14px';
                    line.style.marginBottom = '6px';

                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = fieldMeta.name;
                    radio.dataset.field = fieldMeta.name;
                    radio.value = value;
                    radio.checked = selectedSet.has(value);
                    applyExtraAttributes(radio, fieldMeta.extra);

                    const txt = document.createElement('span');
                    txt.innerText = ' ' + String(opt.label ?? value);

                    line.appendChild(radio);
                    line.appendChild(txt);
                    wrap.appendChild(line);
                });
                return wrap;
            }

            const preferred = selectedValues && selectedValues.length > 0 ? String(selectedValues[0]) : '';
            const fallbackType = resolveTypeNotNullFallbackType(fieldMeta, preferred);
            if (fallbackType) {
                return createFallbackInputControl(fieldMeta, fallbackType, preferred);
            }

            const select = document.createElement('select');
            select.name = fieldMeta.name;
            select.dataset.field = fieldMeta.name;
            select.required = !!fieldMeta.required;
            select.setAttribute('data-field-control', '1');

            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.text = '-- chọn --';
            select.appendChild(placeholder);

            let hasPreferred = false;
            options.forEach(opt => {
                const value = String(opt.value ?? '');
                const option = document.createElement('option');
                option.value = value;
                option.text = String(opt.label ?? value);
                if (preferred !== '' && preferred === value) {
                    option.selected = true;
                    hasPreferred = true;
                }
                select.appendChild(option);
            });
            if (!hasPreferred) {
                select.value = '';
            }
            applyExtraAttributes(select, fieldMeta.extra);
            return select;
        }

        function applyOnChangeOptionsToField(sourceFieldMeta, responseData) {
            const targetName = String(responseData.apply_to_object || sourceFieldMeta.apply_to_object || '').trim();
            if (!targetName) return;
            const targetMeta = (meta.fields || []).find(x => x && x.name === targetName);
            if (!targetMeta) return;

            const form = document.getElementById('cms-edit-form');
            if (!form) return;

            const group = Array.from(form.querySelectorAll('.cms-field-wrap')).find(g => {
                return !!g.querySelector(`[name="${targetName}"]`) || !!g.querySelector(`[data-field="${targetName}"]`);
            });
            if (!group) return;

            const oldControl = group.querySelector('[data-field-control="1"]');
            const selectedValues = getFieldSelectedValues(targetName);
            const renderType = String(responseData.object_type || sourceFieldMeta.object_type || targetMeta.input_type || targetMeta.type || 'select').toLowerCase();
            const options = Array.isArray(responseData.options) ? responseData.options : [];
            const newControl = buildDynamicOptionControl(targetMeta, renderType, options, selectedValues);

            if (oldControl) {
                // Cleanly teardown Select2 before replacing control to avoid orphan UI nodes.
                if (typeof jQuery !== 'undefined' && typeof jQuery.fn.select2 !== 'undefined') {
                    const selects = oldControl.matches && oldControl.matches('select')
                        ? [oldControl]
                        : Array.from(oldControl.querySelectorAll('select'));
                    selects.forEach(sel => {
                        const $sel = jQuery(sel);
                        if ($sel.hasClass('select2-hidden-accessible')) {
                            try { $sel.select2('destroy'); } catch (e) {}
                        }
                    });
                }
                oldControl.replaceWith(newControl);
                Array.from(group.querySelectorAll('span.select2-container')).forEach(node => {
                    if (!node.previousElementSibling || node.previousElementSibling.tagName !== 'SELECT') {
                        node.remove();
                    }
                });
            } else {
                group.appendChild(newControl);
            }
        }

        function childValueToString(v) {
            if (v === null || v === undefined) return '';
            return String(v);
        }

        function parseChildSelectedValues(rawVal) {
            if (Array.isArray(rawVal)) return rawVal.map(v => String(v));
            if (rawVal === null || rawVal === undefined) return [];
            const text = String(rawVal).trim();
            if (!text) return [];
            if (text.startsWith('[') && text.endsWith(']')) {
                try {
                    const arr = JSON.parse(text);
                    if (Array.isArray(arr)) return arr.map(v => String(v));
                } catch (e) {}
            }
            return text.split(',').map(s => s.trim()).filter(Boolean);
        }

        function applyChildFieldAttributes(el, state, col, rowIndex, controlSuffix) {
            el.name = 'child_' + col.name;
            if (controlSuffix) {
                el.id = buildChildFieldId(state, col, rowIndex) + '_' + controlSuffix;
            } else {
                el.id = buildChildFieldId(state, col, rowIndex);
            }
            el.dataset.childTable = state && state.config ? state.config.child_table : '';
            el.dataset.childConfigKey = state && state.config ? state.config.config_key : '';
            el.dataset.childField = col.name;
            el.dataset.childRowIndex = Number.isInteger(rowIndex) ? String(rowIndex) : '';
        }

        function renderChildChoiceInput(state, col, value, rowIndex) {
            const inputType = String(col.input_type || '').toLowerCase();
            const opts = Array.isArray(state.optionsMap[col.name]) ? state.optionsMap[col.name] : [];

            if (inputType === 'checkbox' && opts.length === 0) {
                const input = document.createElement('input');
                input.type = 'checkbox';
                applyChildFieldAttributes(input, state, col, rowIndex);
                input.value = '1';
                const normalizedVal = String(value ?? '').trim().toLowerCase();
                input.checked = normalizedVal === '1' || normalizedVal === 'true' || normalizedVal === 'yes' || value === true || value === 1;
                applyExtraAttributes(input, col.extra || '');
                return input;
            }

            const wrap = document.createElement('div');
            wrap.setAttribute('data-field-control', '1');
            wrap.style.minWidth = '140px';

            if (inputType === 'checkbox') {
                const selectedSet = new Set(parseChildSelectedValues(value));
                const allCheckboxes = [];

                if (opts.length > 1) {
                    const checkAllLine = document.createElement('label');
                    checkAllLine.style.display = 'inline-flex';
                    checkAllLine.style.alignItems = 'center';
                    checkAllLine.style.marginRight = '14px';
                    checkAllLine.style.marginBottom = '6px';
                    checkAllLine.style.fontSize = '12px';
                    checkAllLine.style.color = '#666';

                    const checkAllChk = document.createElement('input');
                    checkAllChk.type = 'checkbox';
                    checkAllChk.dataset.childCheckAll = col.name;

                    const checkAllTxt = document.createElement('span');
                    checkAllTxt.innerText = ' Chọn tất cả';

                    checkAllChk.addEventListener('change', function() {
                        const isChecked = this.checked;
                        allCheckboxes.forEach(chk => {
                            chk.checked = isChecked;
                            chk.dispatchEvent(new Event('change', { bubbles: true }));
                        });
                    });

                    checkAllLine.appendChild(checkAllChk);
                    checkAllLine.appendChild(checkAllTxt);
                    wrap.appendChild(checkAllLine);
                }

                opts.forEach((opt, optIndex) => {
                    const optValue = String(opt.value ?? '');
                    const line = document.createElement('label');
                    line.style.display = 'inline-flex';
                    line.style.alignItems = 'center';
                    line.style.marginRight = '14px';
                    line.style.marginBottom = '6px';

                    const chk = document.createElement('input');
                    chk.type = 'checkbox';
                    applyChildFieldAttributes(chk, state, col, rowIndex, String(optIndex + 1));
                    chk.value = optValue;
                    chk.checked = selectedSet.has(optValue);
                    applyExtraAttributes(chk, col.extra || '');
                    allCheckboxes.push(chk);

                    const txt = document.createElement('span');
                    txt.innerText = ' ' + String(opt.label ?? optValue);

                    chk.addEventListener('change', function() {
                        const checkAll = wrap.querySelector('input[data-child-check-all="' + col.name + '"]');
                        if (!checkAll) return;
                        const allChecked = allCheckboxes.length > 0 && allCheckboxes.every(node => node.checked);
                        const someChecked = allCheckboxes.some(node => node.checked);
                        checkAll.checked = allChecked;
                        checkAll.indeterminate = someChecked && !allChecked;
                    });

                    line.appendChild(chk);
                    line.appendChild(txt);
                    wrap.appendChild(line);
                });

                const checkAll = wrap.querySelector('input[data-child-check-all="' + col.name + '"]');
                if (checkAll) {
                    const allChecked = allCheckboxes.length > 0 && allCheckboxes.every(node => node.checked);
                    const someChecked = allCheckboxes.some(node => node.checked);
                    checkAll.checked = allChecked;
                    checkAll.indeterminate = someChecked && !allChecked;
                }

                return wrap;
            }

            const radioOptions = opts.length > 0
                ? opts
                : [{ value: '1', label: 'Có' }, { value: '0', label: 'Không' }];
            const selectedValue = childValueToString(value);
            radioOptions.forEach((opt, optIndex) => {
                const optValue = String(opt.value ?? '');
                const line = document.createElement('label');
                line.style.display = 'inline-flex';
                line.style.alignItems = 'center';
                line.style.marginRight = '14px';
                line.style.marginBottom = '6px';

                const radio = document.createElement('input');
                radio.type = 'radio';
                applyChildFieldAttributes(radio, state, col, rowIndex, String(optIndex + 1));
                radio.value = optValue;
                radio.checked = selectedValue === optValue;
                applyExtraAttributes(radio, col.extra || '');

                const txt = document.createElement('span');
                txt.innerText = ' ' + String(opt.label ?? optValue);

                line.appendChild(radio);
                line.appendChild(txt);
                wrap.appendChild(line);
            });
            return wrap;
        }

        function notifyParentFormAboutChildChange(state, tr, col, sourceEl) {
            const form = document.getElementById('cms-edit-form');
            if (!form) return;

            const rowIndex = tr && tr.dataset ? Number(tr.dataset.rowIndex || -1) : -1;
            const currentRow = Number.isInteger(rowIndex) && rowIndex >= 0 ? state.rows[rowIndex] : null;
            const detail = {
                source: 'child-record',
                childTable: state && state.config ? state.config.child_table : '',
                childConfigKey: state && state.config ? state.config.config_key : '',
                rowIndex: Number.isInteger(rowIndex) ? rowIndex : -1,
                field: col && col.name ? col.name : (sourceEl && sourceEl.name ? sourceEl.name : ''),
                value: sourceEl ? (sourceEl.type === 'checkbox' ? !!sourceEl.checked : sourceEl.value) : '',
                row: currentRow ? Object.assign({}, currentRow) : null
            };

            try {
                form.dispatchEvent(new CustomEvent('input', { bubbles: true, cancelable: false, detail }));
            } catch (e) {
                try { form.dispatchEvent(new Event('input', { bubbles: true })); } catch (err) {}
            }

            try {
                form.dispatchEvent(new CustomEvent('change', { bubbles: true, cancelable: false, detail }));
            } catch (e) {
                try { form.dispatchEvent(new Event('change', { bubbles: true })); } catch (err) {}
            }

            // Child changes can affect function formulas even when parent fields are unchanged.
            scheduleRecomputeAfterChildChange();
        }

        function buildChildFieldId(state, col, rowIndex) {
            const configKey = state && state.config && state.config.config_key ? String(state.config.config_key).trim() : 'child';
            const safeConfigKey = configKey.replace(/[^A-Za-z0-9_-]/g, '_');
            const base = (col && col.name ? String(col.name).trim() : 'field').replace(/[^A-Za-z0-9_-]/g, '_');
            const idx = Number.isInteger(rowIndex) ? rowIndex + 1 : 1;
            return `${safeConfigKey}_${base}_${idx}`;
        }

        function renderChildSelect(state, col, value, rowIndex) {
            const sel = document.createElement('select');
            sel.name = 'child_' + col.name;
            sel.id = buildChildFieldId(state, col, rowIndex);
            sel.dataset.childTable = state && state.config ? state.config.child_table : '';
            sel.dataset.childConfigKey = state && state.config ? state.config.config_key : '';
            sel.dataset.childField = col.name;
            sel.dataset.childRowIndex = Number.isInteger(rowIndex) ? String(rowIndex) : '';
            sel.style.minWidth = '120px';

            const ph = document.createElement('option');
            ph.value = '';
            ph.text = '-- chon --';
            sel.appendChild(ph);

            const opts = Array.isArray(state.optionsMap[col.name]) ? state.optionsMap[col.name] : [];
            opts.forEach(o => {
                const op = document.createElement('option');
                op.value = childValueToString(o.value);
                op.text = childValueToString(o.label || o.value);
                sel.appendChild(op);
            });

            const current = childValueToString(value);
            if (current && !opts.some(o => childValueToString(o.value) === current)) {
                const op = document.createElement('option');
                op.value = current;
                op.text = current;
                sel.appendChild(op);
            }
            sel.value = current;
            applyExtraAttributes(sel, col.extra || '');
            if (hasSelect2Extra(col.extra || '')) {
                sel.setAttribute('data-select2-enabled', '1');
            }
            return sel;
        }

        function renderChildFileInput(state, col, value, rowIndex) {
            const wrap = document.createElement('div');
            wrap.dataset.fileField = '1';
            wrap.setAttribute('data-field-control', '1');
            wrap.style.display = 'flex';
            wrap.style.flexDirection = 'column';
            wrap.style.gap = '4px';
            wrap.style.minWidth = '160px';

            // Hidden input stores the file URL — read by collectChildRowFromTr via [name="child_X"]
            const hidden = document.createElement('input');
            hidden.type = 'hidden';
            hidden.name = 'child_' + col.name;
            hidden.id = buildChildFieldId(state, col, rowIndex);
            hidden.dataset.childTable = state && state.config ? state.config.child_table : '';
            hidden.dataset.childConfigKey = state && state.config ? state.config.config_key : '';
            hidden.dataset.childField = col.name;
            hidden.dataset.childRowIndex = Number.isInteger(rowIndex) ? String(rowIndex) : '';
            hidden.value = childValueToString(value);

            const preview = document.createElement('div');

            function refreshChildFilePreview(fileUrl) {
                preview.innerHTML = '';
                if (!fileUrl) return;
                const a = document.createElement('a');
                a.href = fileUrl;
                a.target = '_blank';
                a.rel = 'noopener';
                try { a.innerText = fileUrl.split('/').pop() || fileUrl; } catch(e) { a.innerText = fileUrl; }
                a.style.fontSize = '13px';
                preview.appendChild(a);
                const btnRem = document.createElement('button');
                btnRem.type = 'button';
                btnRem.style.marginLeft = '6px';
                btnRem.style.fontSize = '12px';
                btnRem.innerText = 'Xóa';
                btnRem.addEventListener('click', async function() {
                    if (!confirm('Xóa file này?')) return;
                    try {
                        const payload = { table: state.config.child_table, col: col.name, file_url: hidden.value };
                        const resp = await fetch('/api/generic.php?action=file_delete', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                            body: JSON.stringify(payload)
                        });
                        const jr = await resp.json();
                        if (jr && jr.success) {
                            hidden.value = '';
                            refreshChildFilePreview('');
                            hidden.dispatchEvent(new Event('change', { bubbles: true }));
                        } else {
                            alert('Xóa file thất bại: ' + (jr && jr.message ? jr.message : ''));
                        }
                    } catch (err) {
                        alert('Lỗi xóa file: ' + (err && err.message ? err.message : ''));
                    }
                });
                preview.appendChild(btnRem);
            }

            refreshChildFilePreview(childValueToString(value));

            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.name = 'file_child_' + col.name;
            applyExtraAttributes(fileInput, col.extra || '');
            fileInput.addEventListener('change', async function(ev) {
                const fl = ev.target.files && ev.target.files[0];
                if (!fl) return;
                try {
                    const fd = new FormData();
                    fd.append('action', 'file_upload');
                    fd.append('table', state.config.child_table);
                    fd.append('col', col.name);
                    fd.append('id', 'new');
                    fd.append('file', fl);
                    const upl = await fetch('/api/generic.php?action=file_upload', {
                        method: 'POST',
                        body: fd,
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    const jr = await upl.json();
                    if (jr && jr.success && jr.file_url) {
                        hidden.value = jr.file_url;
                        refreshChildFilePreview(jr.file_url);
                        // bubble change up to the wrap div so renderChildRows' syncChildRow fires
                        hidden.dispatchEvent(new Event('change', { bubbles: true }));
                    } else {
                        alert('Upload thất bại: ' + (jr && jr.message ? jr.message : ''));
                    }
                } catch (err) {
                    alert('Lỗi upload: ' + (err && err.message ? err.message : ''));
                }
            });

            wrap.appendChild(hidden);
            wrap.appendChild(preview);
            wrap.appendChild(fileInput);
            return wrap;
        }

        function renderChildInput(state, col, value, rowIndex) {
            if (col.input_type === 'file') {
                return renderChildFileInput(state, col, value, rowIndex);
            }
            if (col.input_type === 'select') {
                return renderChildSelect(state, col, value, rowIndex);
            }
            if (col.input_type === 'checkbox' || col.input_type === 'radio') {
                return renderChildChoiceInput(state, col, value, rowIndex);
            }
            const isTextarea = col.input_type === 'textarea';
            const input = document.createElement(isTextarea ? 'textarea' : 'input');
            applyChildFieldAttributes(input, state, col, rowIndex);
            if (col.input_type === 'number') {
                input.type = 'text';
                input.dataset.childNumberField = '1';
                input.value = sanitizeNumberInputValue(value);
                input.addEventListener('input', function() {
                    var caret = this.selectionStart;
                    var oldLength = this.value.length;
                    this.value = sanitizeNumberInputValue(this.value);
                    var newLength = this.value.length;
                    if (typeof caret === 'number') {
                        var diff = newLength - oldLength;
                        this.selectionStart = this.selectionEnd = Math.max(0, caret + diff);
                    }
                });
                input.addEventListener('paste', function(e) {
                    e.preventDefault();
                    var pasted = (e.clipboardData || window.clipboardData).getData('text');
                    var start = this.selectionStart != null ? this.selectionStart : this.value.length;
                    var end = this.selectionEnd != null ? this.selectionEnd : this.value.length;
                    var next = this.value.slice(0, start) + pasted + this.value.slice(end);
                    this.value = sanitizeNumberInputValue(next);
                    this.dispatchEvent(new Event('input', { bubbles: true }));
                });
            } else if (col.input_type === 'date') {
                input.type = 'date';
            } else if (col.input_type === 'time') {
                input.type = 'time';
            } else if (!isTextarea) {
                input.type = 'text';
            }
            if (col.input_type !== 'number') {
                input.value = childValueToString(value);
            }
            if (hasKeywordFlag(col.more, 'html')) {
                input.setAttribute('data-formatted', '1');
            }
            if (col.required) input.required = true;
            if (col.readonly) {
                input.readOnly = true;
                input.setAttribute('readonly', 'readonly');
            }
            if (col.disabled) {
                input.disabled = true;
                input.setAttribute('disabled', 'disabled');
            }
            applyExtraAttributes(input, col.extra || '');
            return input;
        }

        function createEmptyChildRow(state) {
            const childTableConfig = state.config;
            const row = { __isNew: true, __deleted: false };
            (childTableConfig.columns || []).forEach(col => {
                row[col.name] = '';
            });
            Object.keys(childTableConfig.fixed_values || {}).forEach(k => {
                row[k] = childTableConfig.fixed_values[k];
            });
            return row;
        }

        function collectChildRowFromTr(state, tr) {
            const childTableConfig = state.config;
            const idx = Number(tr.dataset.rowIndex || -1);
            if (!Number.isInteger(idx) || idx < 0 || idx >= state.rows.length) return;
            const row = state.rows[idx];
            (childTableConfig.columns || []).forEach(col => {
                const named = Array.from(tr.querySelectorAll(`[name="child_${col.name}"]`));
                if (!named.length) return;
                named.forEach(el => {
                    if (el.tagName === 'TEXTAREA' && el.getAttribute('data-xinha-initialized') === '1') {
                        try { syncXinhaForElement(el); } catch(e) {}
                    }
                });

                const first = named[0];
                if (col.input_type === 'number' || first.dataset.childNumberField === '1') {
                    const cleaned = parseNumericValue(first.value);
                    row[col.name] = cleaned !== '' ? Number(cleaned) : null;
                } else if (col.input_type === 'checkbox') {
                    const checkboxes = named.filter(el => el.type === 'checkbox');
                    if (checkboxes.length > 1) {
                        row[col.name] = checkboxes.filter(el => el.checked).map(el => el.value).join(',');
                    } else if (checkboxes.length === 1) {
                        row[col.name] = checkboxes[0].checked ? (checkboxes[0].value || '1') : '0';
                    } else {
                        row[col.name] = first.value;
                    }
                } else if (col.input_type === 'radio') {
                    const radios = named.filter(el => el.type === 'radio');
                    const checked = radios.find(el => el.checked);
                    row[col.name] = checked ? checked.value : '';
                } else {
                    row[col.name] = first.value;
                }
            });
        }

        function renderChildRows(state) {
            const childTableConfig = state.config;
            const tbody = state.tbody;
            const note = state.note;
            if (!tbody) return;

            tbody.innerHTML = '';
            const activeRows = state.rows.filter(r => !r.__deleted);
            if (note) {
                if (currentRecordId === 'new' || !currentRecordId) {
                    note.innerText = 'Can luu ban ghi cha truoc khi CRUD du lieu con.';
                } else {
                    note.innerText = `So dong: ${activeRows.length}. Du lieu con se duoc luu khi bam "Luu" form cha.`;
                }
            }

            if (activeRows.length === 0) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = (childTableConfig.columns || []).length + 1;
                td.style.color = '#777';
                td.innerText = 'Chua co du lieu con.';
                tr.appendChild(td);
                tbody.appendChild(tr);
                return;
            }

            state.rows.forEach((row, idx) => {
                if (row.__deleted) return;
                const tr = document.createElement('tr');
                tr.dataset.rowIndex = String(idx);

                (childTableConfig.columns || []).forEach(col => {
                    const td = document.createElement('td');
                    const el = renderChildInput(state, col, row[col.name], idx);
                    const syncChildRow = (sourceEl) => {
                        collectChildRowFromTr(state, tr);
                        notifyParentFormAboutChildChange(state, tr, col, sourceEl || el);
                    };
                    const childControls = el.matches && el.matches('[name="child_' + col.name + '"]')
                        ? [el]
                        : Array.from(el.querySelectorAll('[name="child_' + col.name + '"]'));
                    if (childControls.length > 0) {
                        childControls.forEach(control => {
                            const isTextLikeInput = control.tagName === 'TEXTAREA' || (control.tagName === 'INPUT' && !['checkbox', 'radio', 'file', 'hidden'].includes(String(control.type || '').toLowerCase()));
                            if (isTextLikeInput) {
                                control.addEventListener('input', () => syncChildRow(control));
                            }
                            control.addEventListener('change', () => syncChildRow(control));
                        });
                    } else {
                        el.addEventListener('change', () => syncChildRow(el));
                    }
                    td.appendChild(el);
                    tr.appendChild(td);
                });

                const tda = document.createElement('td');
                const btnDelete = document.createElement('button');
                btnDelete.type = 'button';
                btnDelete.className = 'cms-btn cms-btn-delete';
                btnDelete.innerText = 'Xoa';
                btnDelete.addEventListener('click', () => {
                    const pk = childTableConfig.child_pk;
                    const pkVal = row[pk];
                    if (pkVal !== undefined && pkVal !== null && String(pkVal).trim() !== '') {
                        state.deletedIds.push(pkVal);
                    }
                    row.__deleted = true;
                    renderChildRows(state);
                    notifyParentFormAboutChildChange(state, tr, null, null);
                });
                tda.appendChild(btnDelete);
                tr.appendChild(tda);

                tbody.appendChild(tr);
            });

            try { initXinhaEditors(document.getElementById('cms-child-table-area')); } catch (e) {}
        }

        async function loadChildSelectOptions(state) {
            const childTableConfig = state.config;
            state.optionsMap = {};
            for (const col of (childTableConfig.columns || [])) {
                if (!['select', 'checkbox', 'radio'].includes(col.input_type)) continue;
                if (!col.q_code) {
                    state.optionsMap[col.name] = [];
                    continue;
                }
                try {
                    const opts = await fetchOptionsByQCode(col.q_code);
                    state.optionsMap[col.name] = Array.isArray(opts) ? opts : [];

            const childTableConfig = state.config;
            state.rows = [];
            state.deletedIds = [];

            if (currentRecordId === 'new' || !currentRecordId) {
                renderChildRows(state);
                return;
            }

            let url = `/api/generic.php?action=list&table=${encodeURIComponent(childTableConfig.child_table)}&page=1&limit=1000`;
            url += `&${encodeURIComponent(childTableConfig.parent_fk)}=${encodeURIComponent(currentRecordId)}`;
            Object.keys(childTableConfig.filter || {}).forEach(k => {
                const v = childTableConfig.filter[k];

            });

            const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });

            if (!data || !data.success) {
                state.rows = [];
                renderChildRows(state);
                return;
            }
            state.rows = Array.isArray(data.rows) ? data.rows.map(r => Object.assign({ __isNew: false, __deleted: false }, r)) : [];

                childTablesReady = false;

                    childTableStates = [];
                    childTablesReady = true;
                    return;
                }

        async function triggerOnChangeQuery(fieldMeta) {
            if (!fieldMeta || !fieldMeta.on_change_q_code) return;
            const form = document.getElementById('cms-edit-form');
            if (!form) return;

            const formValues = collectCurrentFormValues(form);
            const changedValue = Object.prototype.hasOwnProperty.call(formValues, fieldMeta.name)
                ? formValues[fieldMeta.name]
                : '';
            const payload = Object.assign({}, getUrlParamPayload(), {
                on_change_q_code: fieldMeta.on_change_q_code,
                field_name: fieldMeta.name,
                field_value: changedValue,
                form_values: formValues
            });

            try {
                const res = await fetch('/api/generic.php?action=on_change_options', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token,
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (data && data.success) {

                    try { initSelect2Large(); } catch (e) {}
                }
            } catch (e) {}

        async function waitForFieldReady(fieldName, timeoutMs = 2400, intervalMs = 80) {
            const startedAt = Date.now();
            let lastSnapshot = null;
            let stableCount = 0;

            while (Date.now() - startedAt < timeoutMs) {
                const selectedValues = getFieldSelectedValues(fieldName);
                const snapshot = JSON.stringify(selectedValues);
                if (selectedValues.length > 0) {
                    if (snapshot === lastSnapshot) {
                        stableCount += 1;
                    } else {
                        stableCount = 1;
                        lastSnapshot = snapshot;
                    }

                    if (stableCount >= 2) {
                        return;
                    }
                }

                await new Promise(resolve => setTimeout(resolve, intervalMs));
            }
        }

        function getParentDependencyFields(depField, deps) {
            return deps
                .filter(d => String(d.apply_to_object || '').trim() === depField)
                .map(d => String(d.name || '').trim())
                .filter(Boolean);
        }

        async function runInitialOnChangeDependencies(deps) {
            const pending = deps.slice();
            const doneFields = new Set();
            let safety = 0;

            while (pending.length > 0 && safety < deps.length + 6) {
                safety += 1;
                let progressed = false;

                for (let i = 0; i < pending.length; i++) {
                    const dep = pending[i];
                    const depField = String(dep.name || '').trim();
                    if (!depField) {
                        pending.splice(i, 1);
                        i -= 1;
                        continue;
                    }

                    const parentFields = getParentDependencyFields(depField, deps);
                    const canRunNow = parentFields.every(parent => doneFields.has(parent));
                    if (!canRunNow) continue;

                    await waitForFieldReady(depField);
                    await triggerOnChangeQuery(dep);
                    doneFields.add(depField);

                    pending.splice(i, 1);
                    i -= 1;
                    progressed = true;
                }

                if (!progressed) {
                    // Fallback to avoid deadlock on circular/broken metadata.
                    const dep = pending.shift();
                    if (!dep) break;
                    const depField = String(dep.name || '').trim();
                    if (depField) {
                        await waitForFieldReady(depField, 1200, 60);
                    }
                    await triggerOnChangeQuery(dep);
                    if (depField) doneFields.add(depField);
                }
            }
        }

        async function bindOnChangeDependencies() {
            const form = document.getElementById('cms-edit-form');
            if (!form || !meta || !Array.isArray(meta.fields)) return;

            const deps = meta.fields.filter(f => {
                return f && String(f.on_change_q_code || '').trim() !== '' && String(f.apply_to_object || '').trim() !== '';
            });
            if (deps.length === 0) return;

            for (const f of deps) {
                const els = Array.from(form.querySelectorAll(`[name="${f.name}"]`));
                els.forEach(el => {
                    el.addEventListener('change', function() {
                        triggerOnChangeQuery(f);
                    });
                });
            }

            await runInitialOnChangeDependencies(deps);
        }

                        headers: { 'Authorization': 'Bearer ' + token }
                    });
