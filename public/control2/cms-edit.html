        function validateChildRowsBeforeSave() {
            for (const state of childTableStates) {
                const childTableConfig = state.config;
                const activeRows = state.rows.filter(r => !r.__deleted);
                for (const row of activeRows) {
                    for (const col of (childTableConfig.columns || [])) {
                        if (!col.required) continue;
                        const v = row[col.name];
                        if (v === null || v === undefined || String(v).trim() === '') {
                            return { ok: false, message: `Thiếu dữ liệu bắt buộc ở bảng con: ${col.label || col.name}` };
                        }
                    }
                }
            }
            return { ok: true, message: '' };
        }

        async function saveChildTableRows(parentId) {
            const parentValue = String(parentId || '').trim();
            if (!parentValue) return;

            for (const state of childTableStates) {
                const childTableConfig = state.config;
                const pk = childTableConfig.child_pk;
                const tableName = childTableConfig.child_table;
                const activeRows = state.rows.filter(r => !r.__deleted);

                for (const deletedId of state.deletedIds) {
                    const delUrl = `/api/generic.php?action=delete&table=${encodeURIComponent(tableName)}&id=${encodeURIComponent(deletedId)}`;
                    const delRes = await fetch(delUrl, {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    const delData = await delRes.json();
                    if (!delData || !delData.success) {
                        throw new Error(delData && delData.message ? delData.message : 'Xóa dữ liệu con thất bại');
                    }
                }

                for (const row of activeRows) {
                    const payload = {};
                    (childTableConfig.columns || []).forEach(col => {
                        payload[col.name] = row[col.name];
                    });

                    payload[childTableConfig.parent_fk] = Number(parentValue);
                    Object.keys(childTableConfig.fixed_values || {}).forEach(k => {
                        payload[k] = childTableConfig.fixed_values[k];
                    });

                    const rowPk = row[pk];
                    if (rowPk !== undefined && rowPk !== null && String(rowPk).trim() !== '') {
                        const editUrl = `/api/generic.php?action=edit&table=${encodeURIComponent(tableName)}&id=${encodeURIComponent(rowPk)}`;
                        const editRes = await fetch(editUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + token
                            },
                            body: JSON.stringify(payload)
                        });
                        const editData = await editRes.json();
                        if (!editData || !editData.success) {
                            throw new Error(editData && editData.message ? editData.message : 'Cập nhật dữ liệu con thất bại');
                        }
                    } else {
                        const insUrl = `/api/generic.php?action=insert&table=${encodeURIComponent(tableName)}`;
                        const insRes = await fetch(insUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + token
                            },
                            body: JSON.stringify(payload)
                        });
                        const insData = await insRes.json();
                        if (!insData || !insData.success) {
                            throw new Error(insData && insData.message ? insData.message : 'Thêm dữ liệu con thất bại');
                        }
                        if (insData.insert_id) {
                            row[pk] = insData.insert_id;
                        }
                    }
                }

                state.deletedIds = [];
            }
        }

        function collectChildTablePayload() {
            return (childTableStates || []).map(state => {
                const childTableConfig = state.config;
                const activeRows = (state.rows || []).filter(row => !row.__deleted).map(row => {
                    const payload = {};
                    (childTableConfig.columns || []).forEach(col => {
                        payload[col.name] = row[col.name];
                    });
                    return payload;
                });

                return {
                    config_key: childTableConfig.config_key,
                    child_table: childTableConfig.child_table,
                    child_pk: childTableConfig.child_pk,
                    parent_fk: childTableConfig.parent_fk,
                    rows: activeRows,
                    deleted_ids: Array.isArray(state.deletedIds) ? state.deletedIds.slice() : []
                };
            });
        }

        // Render cms_token info in debug panel (copy / inline edit / clear)
        function renderTokenInfo() {
            const el = document.getElementById('cms-debug-token');
            if (!el) return;
            const t = localStorage.getItem('cms_token');

            // If no token, show an inline input to set one
            if (!t) {
                el.innerHTML = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><strong style="min-width:86px">cms_token:</strong><input id="cms-token-input" placeholder="Chưa có token..." style="padding:6px;font-family:monospace;width:340px"><button id="cms-token-set" style="padding:4px 8px">Đặt token</button></div>`;
                const setBtn = document.getElementById('cms-token-set');
                const input = document.getElementById('cms-token-input');
                if (setBtn) setBtn.addEventListener('click', () => {
                    const val = String(input.value || '').trim();
                    if (!val) { alert('Token rỗng. Hủy bỏ.'); return; }
                    localStorage.setItem('cms_token', val);
                    renderTokenInfo();
                    alert('Token đã được đặt');
                });
                return;
            }

            const masked = t.length > 24 ? t.slice(0,10) + '…' + t.slice(-8) : t;
            el.innerHTML = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><strong style="min-width:86px">cms_token:</strong><span id="cms-token-masked" style="font-family:monospace;color:#333">${masked}</span><button id="cms-token-copy" style="padding:4px 8px">Sao chép</button><button id="cms-token-update" style="padding:4px 8px">Cập nhật</button><button id="cms-token-clear" style="padding:4px 8px">Xóa token</button></div><div id="cms-token-input-wrap" style="margin-top:8px;display:none"></div>`;

            const copyBtn = document.getElementById('cms-token-copy');
            const updateBtn = document.getElementById('cms-token-update');
            const clearBtn = document.getElementById('cms-token-clear');

            if (copyBtn) copyBtn.addEventListener('click', async () => {
                try { await navigator.clipboard.writeText(t); alert('Đã sao chép token vào clipboard'); } catch (e) { prompt('Copy token:', t); }
            });

            if (clearBtn) clearBtn.addEventListener('click', () => {
                if (!confirm('Xóa token khỏi localStorage?')) return;
                localStorage.removeItem('cms_token'); renderTokenInfo(); alert('Token đã bị xóa');
            });

            if (updateBtn) updateBtn.addEventListener('click', () => {
                const wrap = document.getElementById('cms-token-input-wrap');
                if (!wrap) return;
                wrap.style.display = 'block';
                wrap.innerHTML = '';
                const input = document.createElement('input');
                input.id = 'cms-token-input';
                input.style.padding = '6px';
                input.style.fontFamily = 'monospace';
//                input.style.width = '420px';
                input.value = t;
                const save = document.createElement('button');
                save.id = 'cms-token-save';
                save.style.padding = '4px 8px';
                save.innerText = 'Lưu';
                const cancel = document.createElement('button');
                cancel.id = 'cms-token-cancel';
                cancel.style.padding = '4px 8px';
                cancel.style.marginLeft = '6px';
                cancel.innerText = 'Hủy';
                wrap.appendChild(input);
                wrap.appendChild(save);
                wrap.appendChild(cancel);

                save.addEventListener('click', () => {
                    const newVal = String(input.value || '').trim();
                    if (newVal === '') {
                        if (confirm('Bạn đã nhập rỗng. Xóa token thay vì lưu?')) {
                            localStorage.removeItem('cms_token');
                            renderTokenInfo();
                            alert('Token đã bị xóa');
                            return;
                        } else {
                            return;
                        }
                    }
                    localStorage.setItem('cms_token', newVal);
                    renderTokenInfo();
                    alert('Token đã được cập nhật');
                });

                cancel.addEventListener('click', () => {
                    renderTokenInfo();
                });
            });
        }

            if (!data.table_rules.length) {
                html += '<span style="color:#c00">Không có rule nào</span>';
            } else {
                data.table_rules.forEach(rule => {
                    const mc = rule.matched ? '#276827' : '#aaa';

                    if (rule.can_update) perms.push('<span style="color:darkorange">update</span>');
                    if (rule.can_delete) perms.push('<span style="color:red">delete</span>');

                    html += `<div style="border:1px solid ${mc};border-radius:4px;padding:5px 10px;margin:4px 0">`;
                    html += `<div><b>Rule #${rule.id}</b> <span style="color:${mc};font-size:12px">${mt}</span></div>`;
                    html += `<div>Roles: ${rolesTags || '<span style="color:#aaa">trống</span>'}</div>`;
                    html += `<div>Quyền: ${perms.length ? perms.join(' | ') : '<span style="color:#aaa">không có</span>'}</div>`;
                    if (rule.self_record) html += `<div style="color:#888;font-size:12px">self_record: ${rule.self_record}</div>`;
                    html += '</div>';
                });
            }
            el.innerHTML = html;
        }

        async function renderForm() {
            const form = document.getElementById('cms-edit-form');
            form.innerHTML = '';
            const previewFormulas = parseFormulas(meta && meta.formulas ? meta.formulas : '');
            const hasRemotePmsFunction = previewFormulas.some(formula => formula && formula.type === 'function' && formula.funcCode);
            for (const f of (meta.fields || [])) {
                if (!f.show_form) continue;
                if (f.server_auto) continue;
                const isPK = (f.name === primaryKey);
                // Thêm mới: bỏ qua field primary key (Auto Increment)
                if (isNew && isPK) continue;
                const group = document.createElement('div');
                // Wrapper that may receive a width from server metadata (f.form_width)
                group.className = 'cms-form-group cms-field-wrap';
                // Allow specifying width via metadata: number => percent, or raw CSS value (e.g. '300px' or '30%')
                try {
                    let w = '' + (f.form_width ?? '');
                    w = w.trim();
                    if (w) {
                        // If metadata provides width, mark as fixed and apply it
                        let wCss = '';
                        if (/^\d+$/.test(w)) wCss = w + '%';
                        else wCss = w;
                        group.dataset.fixedWidth = '1';
                        group.style.width = wCss;
                    } else {
                        // no metadata width: leave width empty so global selector can control it
                        group.dataset.fixedWidth = '0';
                    }
                } catch (e) {
                    group.dataset.fixedWidth = '0';
                }
                const label = document.createElement('label');
                label.innerText = f.label || f.name;
                if (!isPK && f.required) label.innerHTML += ' <span style="color:#d32f2f">*</span>';
                // Sửa: thêm badge "Khóa chính" bên cạnh label
                if (!isNew && isPK) label.innerHTML += ' <span style="color:#888;font-size:12px;font-weight:normal">(khóa chính)</span>';
                // Store label reference to potentially add check-all later
                const labelContainer = document.createElement('div');
                labelContainer.style.display = 'flex';
                labelContainer.style.alignItems = 'center';
                labelContainer.style.gap = '12px';
                labelContainer.style.marginBottom = '6px';
                labelContainer.appendChild(label);
                if (f.link_url) {
                    const link = document.createElement('a');
                    link.href = String(f.link_url).trim();
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.innerText = 'Link';
                    link.style.fontSize = '0.9em';
                    link.style.color = '#1665d8';
                    link.style.textDecoration = 'none';
                    link.style.marginLeft = '4px';
                    labelContainer.appendChild(link);
                }
                let input;
                // Render theo input_type
                const val = record[f.name] ?? '';
                const fieldType = String(f.input_type || f.type || '').toLowerCase();
                const fallbackTypeForNotNull = resolveTypeNotNullFallbackType(f, val);
                const parseSelectedValues = (rawVal) => {
                    if (Array.isArray(rawVal)) return rawVal.map(v => String(v));
                    if (rawVal === null || rawVal === undefined) return [];
                    const text = String(rawVal).trim();
                    if (!text) return [];
                    if (text.startsWith('[') && text.endsWith(']')) {
                        try {
                            const arr = JSON.parse(text);
                            if (Array.isArray(arr)) return arr.map(v => String(v));
                        } catch (_) {
                            // Fallback xuống split bằng dấu phẩy.
                        }
                    }
                    return text.split(',').map(s => s.trim()).filter(Boolean);
                };
                // Sửa: field primary key → readonly text
                if (!isNew && isPK) {
                    input = document.createElement('input');
                    input.type = 'text';
                    input.name = f.name;
                    input.value = val;
                    input.readOnly = true;
                    input.style.background = '#f0f0f0';
                    input.style.color = '#888';
                    input.style.cursor = 'not-allowed';
                    group.appendChild(labelContainer);
                    group.appendChild(input);
                    form.appendChild(group);
                    continue;
                }

                // type_not_null: nếu field đang có giá trị thì render theo kiểu fallback,
                // không phụ thuộc input_type/select/q_code hiện tại.
                if (fallbackTypeForNotNull) {
                    input = createFallbackInputControl(f, fallbackTypeForNotNull, val);
                    group.appendChild(labelContainer);
                    group.appendChild(input);
                    form.appendChild(group);
                    continue;
                }

                let options = [];
                if (f.q_code) {
                    options = await fetchOptionsByQCode(f.q_code);
                }

                if (fieldType === 'checkbox') {
                    if (options.length > 0) {
                        const selectedSet = new Set(parseSelectedValues(val));
                        input = document.createElement('div');
                        
                        // Create check-all checkbox to add to labelContainer
                        const checkAllLabel = document.createElement('label');
                        checkAllLabel.style.display = 'inline-flex';
                        checkAllLabel.style.alignItems = 'center';
                        checkAllLabel.style.cursor = 'pointer';
                        checkAllLabel.style.fontSize = '13px';
                        checkAllLabel.style.color = '#666';
                        
                        const checkAllChk = document.createElement('input');
                        checkAllChk.type = 'checkbox';
                        checkAllChk.style.cursor = 'pointer';
                        checkAllChk.dataset.checkAll = f.name;
                        
                        const checkAllText = document.createElement('span');
                        checkAllText.innerText = ' Chọn tất cả';
                        
                        checkAllLabel.appendChild(checkAllChk);
                        checkAllLabel.appendChild(checkAllText);
                        labelContainer.appendChild(checkAllLabel);
                        
                        // Track all checkboxes for this field
                        const allCheckboxes = [];
                        
                        options.forEach(opt => {
                            const optValue = String(opt.value ?? '');
                            const wrap = document.createElement('label');
                            wrap.style.display = 'inline-flex';
                            wrap.style.alignItems = 'center';
                            wrap.style.marginRight = '14px';
                            wrap.style.marginBottom = '6px';

                            const chk = document.createElement('input');
                            chk.type = 'checkbox';
                            chk.name = f.name;
                            chk.dataset.field = f.name;
                            chk.value = optValue;
                            chk.checked = selectedSet.has(optValue);
                            allCheckboxes.push(chk);
                            // Apply extra attributes to individual checkbox input
                            applyExtraAttributes(chk, f.extra);

                            const txt = document.createElement('span');
                            txt.innerText = ' ' + (opt.label ?? optValue);

                            wrap.appendChild(chk);
                            wrap.appendChild(txt);
                            input.appendChild(wrap);
                        });
                        
                        // Event listener cho check-all checkbox
                        checkAllChk.addEventListener('change', function() {
                            const isChecked = this.checked;
                            allCheckboxes.forEach(chk => {
                                chk.checked = isChecked;
                            });
                        });
                        
                        // Event listener cho từng checkbox con để cập nhật check-all status
                        allCheckboxes.forEach(chk => {
                            chk.addEventListener('change', function() {
                                const allChecked = allCheckboxes.every(c => c.checked);
                                const someChecked = allCheckboxes.some(c => c.checked);
                                checkAllChk.checked = allChecked;
                                checkAllChk.indeterminate = someChecked && !allChecked;
                            });
                        });
                        
                        // Initialize check-all initial state
                        const allChecked = allCheckboxes.every(c => c.checked);
                        const someChecked = allCheckboxes.some(c => c.checked);
                        checkAllChk.checked = allChecked;
                        checkAllChk.indeterminate = someChecked && !allChecked;
                    } else {
                        input = document.createElement('input');
                        input.type = 'checkbox';
                        input.name = f.name;
                        input.dataset.field = f.name;
                        input.value = '1';
                        const normalizedVal = String(val ?? '').trim().toLowerCase();
                        input.checked = normalizedVal === '1' || normalizedVal === 'true' || normalizedVal === 'yes' || val === true || val === 1;
                        // Apply extra attributes to single checkbox input
                        applyExtraAttributes(input, f.extra);
                    }
                } else if (fieldType === 'radio') {
                    input = document.createElement('div');
                    const radioOptions = options.length > 0
                        ? options
                        : [{ value: '1', label: 'Có' }, { value: '0', label: 'Không' }];
                    radioOptions.forEach(opt => {
                        const optValue = String(opt.value ?? '');
                        const wrap = document.createElement('label');
                        wrap.style.display = 'inline-flex';
                        wrap.style.alignItems = 'center';
                        wrap.style.marginRight = '14px';
                        wrap.style.marginBottom = '6px';

                        const radio = document.createElement('input');
                        radio.type = 'radio';
                        radio.name = f.name;
                        radio.dataset.field = f.name;
                        radio.value = optValue;
                        if (String(val) == optValue) radio.checked = true;
                        // Apply extra attributes to individual radio input
                        applyExtraAttributes(radio, f.extra);

                        const lbl = document.createElement('span');
                        lbl.innerText = ' ' + (opt.label ?? optValue);

                        wrap.appendChild(radio);
                        wrap.appendChild(lbl);
                        input.appendChild(wrap);
                    });
                } else if (f.q_code || fieldType === 'select') {
                        const fallbackType = resolveTypeNotNullFallbackType(f, val);
                        if (fallbackType) {
                            input = createFallbackInputControl(f, fallbackType, val);
                        } else {
                            input = document.createElement('select');
                            input.name = f.name;
                            input.dataset.field = f.name;
                            input.required = !!f.required;
                            // prepend a null/placeholder option
                            const placeholder = document.createElement('option');
                            placeholder.value = '';
                            placeholder.text = '-- chọn --';
                            input.appendChild(placeholder);
                            if (options.length > 0) {
                                for (const opt of options) {
                                    const option = document.createElement('option');
                                    option.value = opt.value;
                                    option.text = opt.label;
                                    if (val == opt.value) option.selected = true;
                                    input.appendChild(option);
                                }
                            } else if (f.q_code) {
                                const option = document.createElement('option');
                                option.value = '';
                                option.text = '-- Không có dữ liệu --';
                                input.appendChild(option);
                            }
                            // Apply extra attributes
                            applyExtraAttributes(input, f.extra);
                        }
                } else if (fieldType === 'textarea') {
                    input = document.createElement('textarea');
                    input.name = f.name;
                    input.dataset.field = f.name;
                    input.value = val;
                    if (f.required) input.required = true;
                    // If server marks this field as formatted (table_definitions.is_formatted), tag it
                    try {
                        const isFormattedFlag = (f.is_formatted === true) || String(f.is_formatted) === '1' || String(f.is_formatted).toLowerCase() === 'true';
                        if (isFormattedFlag) input.setAttribute('data-formatted', '1');
                    } catch (e) {}
                    // Apply extra attributes
                    applyExtraAttributes(input, f.extra);
                } else if (fieldType === 'number') {
                    input = document.createElement('input');
                    input.type = 'text';
                    input.name = f.name;
                    input.dataset.field = f.name;
                    input.value = sanitizeNumberInputValue(val);
                    if (f.required) input.required = true;
                    input.dataset.numberField = '1';
                    input.addEventListener('input', function() {
                        const caret = this.selectionStart;
                        const oldLen = this.value.length;
                        this.value = sanitizeNumberInputValue(this.value);
                        const newLen = this.value.length;
                        if (typeof caret === 'number') {
                            const diff = newLen - oldLen;
                            this.selectionStart = this.selectionEnd = Math.max(0, caret + diff);
                        }
                    });
                    input.addEventListener('paste', function(e) {
                        e.preventDefault();
                        const pasted = (e.clipboardData || window.clipboardData).getData('text');
                        const start = this.selectionStart != null ? this.selectionStart : this.value.length;
                        const end = this.selectionEnd != null ? this.selectionEnd : this.value.length;
                        const next = this.value.slice(0, start) + pasted + this.value.slice(end);
                        this.value = sanitizeNumberInputValue(next);
                        this.dispatchEvent(new Event('input', { bubbles: true }));
                    });
                    // Apply extra attributes
                    applyExtraAttributes(input, f.extra);
                } else if (fieldType === 'date') {
                    input = document.createElement('input');
                    input.type = 'date';
                    input.name = f.name;
                    input.dataset.field = f.name;
                    input.value = val;
                    if (f.required) input.required = true;
                    // Apply extra attributes
                    applyExtraAttributes(input, f.extra);
                } else if (fieldType === 'time') {
                    input = document.createElement('input');
                    input.type = 'time';
                    input.name = f.name;
                    input.dataset.field = f.name;
                    input.value = val;
                    if (f.required) input.required = true;
                    // Apply extra attributes
                    applyExtraAttributes(input, f.extra);
                } else {
                    input = document.createElement('input');
                    input.type = 'text';
                    input.name = f.name;
                    input.dataset.field = f.name;
                    input.value = val;
                    if (f.required) input.required = true;
                    // Apply extra attributes
                    applyExtraAttributes(input, f.extra);
                }
                // Handle file inputs: show current link + upload control
                if (fieldType === 'file' || fieldType === 'image') {
                    // hidden input to store file_url (will be submitted as normal field)
                    const hidden = document.createElement('input');
                    hidden.type = 'hidden';
                    hidden.name = f.name;
                    hidden.value = val || '';

                    const fileWrap = document.createElement('div');
                    fileWrap.style.display = 'flex';
                    fileWrap.style.flexDirection = 'column';
                    fileWrap.style.gap = '6px';
                    fileWrap.setAttribute('data-field-control', '1');

                    const currentLink = document.createElement('div');
                    if (val) {
                        web_root = '/';
                        const a = document.createElement('a');
                        a.href = web_root + val;
                        a.target = '_blank';
                        a.rel = 'noopener';
                        try { a.innerText = val.split('/').pop() || val; } catch(e) { a.innerText = val; }
                        currentLink.appendChild(a);
                        const btnRem = document.createElement('button');
                        btnRem.type = 'button';
                        btnRem.style.marginLeft = '8px';
                        btnRem.innerText = 'Xóa';
                        btnRem.addEventListener('click', async function(){
                            if (!confirm('Xóa file hiện tại khỏi bản ghi?')) return;
                            try {
                                const payload = { table: table, col: f.name, id: isNew ? 'new' : id, file_url: val };
                                const resp = await fetch('/api/generic.php?action=file_delete', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify(payload) });
                                const jr = await resp.json();
                                if (jr && jr.success) {
                                    hidden.value = '';
                                    currentLink.innerHTML = '';
                                } else {
                                    alert('Xóa file thất bại: ' + (jr && jr.message ? jr.message : 'Không xác định'));
                                }
                            } catch (err) {
                                alert('Lỗi xóa file: ' + (err && err.message ? err.message : 'Kết nối lỗi'));
                            }
                        });
                        currentLink.appendChild(btnRem);
                    }

                    const fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.name = `file_field_${f.name}`;
                    // Apply extra attributes to file input
                    applyExtraAttributes(fileInput, f.extra);
                    fileInput.addEventListener('change', async function(ev){
                        const fl = (ev.target.files && ev.target.files[0]) || null;
                        if (!fl) return;
                        // upload immediately
                        try {
                            const fd = new FormData();
                            fd.append('action','file_upload');
                            fd.append('table', table);
                            fd.append('col', f.name);
                            fd.append('id', isNew ? 'new' : id);
                            fd.append('file', fl);
                            const upl = await fetch('/api/generic.php?action=file_upload', { method: 'POST', body: fd, headers: { 'Authorization': 'Bearer ' + token } });
                            const jr = await upl.json();
                            if (jr && jr.success && jr.file_url) {
                                hidden.value = jr.file_url;
                                // update display
                                currentLink.innerHTML = '';
                                const a2 = document.createElement('a'); a2.href = jr.file_url; a2.target='_blank'; a2.rel='noopener'; a2.innerText = jr.file_url.split('/').pop() || jr.file_url;
                                currentLink.appendChild(a2);
                            } else {
                                alert('Upload thất bại: ' + (jr && jr.message ? jr.message : 'Không xác định'));
                            }
                        } catch (err) {
                            alert('Lỗi upload: ' + (err && err.message ? err.message : 'Kết nối lỗi'));
                        }
                    });

                    fileWrap.appendChild(currentLink);
                    fileWrap.appendChild(fileInput);
                    // replace input with our file UI
                    group.appendChild(labelContainer);
                    group.appendChild(hidden);
                    group.appendChild(fileWrap);
                    form.appendChild(group);
                    continue; // skip default append since already handled
                }
                // Field có extra chứa flag 'random_code': readonly, backend tự sinh mã duy nhất khi lưu.
                if (hasKeywordFlag(f.extra, 'random_code') && input && input.tagName !== 'DIV') {
                    input.readOnly = true;
                    input.setAttribute('readonly', 'readonly');
                    input.style.background = '#f5f5f5';
                    input.style.color = '#888';
                    input.style.cursor = 'not-allowed';
                    if (isNew && (!input.value || input.value.trim() === '')) {
                        input.placeholder = 'Tự động tạo khi lưu';
                    }
                }
                group.appendChild(labelContainer);
                input.setAttribute('data-field-control', '1');
                group.appendChild(input);
                form.appendChild(group);
            }
            const customActionButtons = getCustomActionButtonsFromMeta();
            if (hasRemotePmsFunction || customActionButtons.length > 0) {
                form.appendChild(createRecalculateBlock(customActionButtons, hasRemotePmsFunction));
            }
            
            // Enter trong field sẽ submit form (trừ textarea để giữ xuống dòng).
            if (!form.dataset.enterSubmitBound) {
                form.addEventListener('keydown', function(e) {
                    if (e.key !== 'Enter') return;
                    const target = e.target;
                    if (!target) return;
                    if (target.tagName === 'TEXTAREA') return;
                    if (target.tagName === 'BUTTON') return;
                    if (!isNew && isRecordLocked) return;
                    e.preventDefault();
                    form.requestSubmit();
                });
                form.dataset.enterSubmitBound = '1';
            }
            // Apply global field width (from selector) after form rendered
            try { applyFieldWrapWidth(); } catch (e) {}
            // Apply URL _id defaults to select/radio/checkbox fields before dependency binding
            try { applyUrlIdDefaultsToControls(); } catch (e) {}
            // Render child-table block(s) early so formula/on-change payload can include child fields.
            try { await renderChildTablesIfNeeded(); } catch (e) {}
            // Bind dependent on-change queries after all fields are rendered
            try { await bindOnChangeDependencies(); } catch (e) {}
            // Wire formula auto-calculation if configured
            try {
                window.cmsFormulas = parseFormulas(meta.formulas || '');
                if (window.cmsFormulas.length > 0) {
                    const fieldNames = (meta.fields || []).map(f => f.name);
                    window.cmsFormulas.forEach(formula => {
                        formula.fields = fieldNames.filter(name => {
                            const regex = new RegExp('\\b' + escapeRegExp(name) + '\\b', 'g');
                            return regex.test(formula.text);
                        });
                    });
                    bindFormulaInputs();
                    // On initial form load, do not auto-call remote do_pms_function formulas.
                    // Only compute local formulas to avoid unintended value overrides.
                    recomputeFormulas({ skipRemoteFunctions: true });
                }
            } catch (e) {}
            // Enhance selects explicitly marked with extra="select2"
            try { initSelect2Large(); } catch (e) {}
            // Initialize Xinha for formatted textareas (initXinhaEditors will no-op if none)
            try { initXinhaEditors(document.getElementById('cms-edit-form')); } catch (e) {}
        }

        // Initialize select2 only for select elements explicitly marked in table_definitions.extra
        function initSelect2Large() {
            if (typeof jQuery === 'undefined' || typeof jQuery.fn.select2 === 'undefined') return;
            const $form = jQuery('#cms-edit-form');
            if (!$form.length) return;
            $form.find('select').each(function() {
                const $sel = jQuery(this);
                // destroy existing select2 instance if present
                if ($sel.hasClass('select2-hidden-accessible')) {
                    try { $sel.select2('destroy'); } catch (e) {}
                }
                if (shouldInitSelect2(this)) {
                    try {
                        $sel.select2({
                            theme: 'bootstrap-5',
                            width: 'style',
                            dropdownAutoWidth: true,
                            placeholder: $sel.find('option[value=""]').text() || '-- chọn --'
                        });
                    } catch (e) {
                        // ignore
                    }
                }
            });
        }

        document.getElementById('cms-edit-form').onsubmit = async function(e) {
            e.preventDefault();
            if (!isNew && isRecordLocked) {
                applyLockedSaveState();
                return;
            }
            setSaveButtonsDisabled(true);
            document.getElementById('cms-error').style.display = 'none';
            const data = {};
            for (const f of (meta.fields || [])) {
                if (!f.show_form) continue;
                const name = f.name;
                const type = String(f.input_type || f.type || '').toLowerCase();
                const escapedName = (typeof CSS !== 'undefined' && typeof CSS.escape === 'function')
                    ? CSS.escape(name)
                    : String(name).replace(/"/g, '\\"');
                const namedControls = Array.from(e.target.querySelectorAll(`[name="${escapedName}"]`))
                    .filter(node => !node.disabled);
                if (!namedControls.length) continue;

                const first = namedControls[0];
                if (first.tagName === 'SELECT') {
                    if (first.multiple) {
                        data[name] = Array.from(first.selectedOptions || []).map(o => o.value);
                    } else {
                        data[name] = first.value;
                    }
                    continue;
                }

                if (first.type === 'checkbox' || type === 'checkbox') {
                    const checkboxes = namedControls.filter(node => node.type === 'checkbox');
                    if (checkboxes.length > 1) {
                        data[name] = checkboxes.filter(node => node.checked).map(node => node.value).join(',');
                    } else if (checkboxes.length === 1) {
                        data[name] = checkboxes[0].checked ? (checkboxes[0].value || '1') : '0';
                    } else {
                        data[name] = '';
                    }
                    continue;
                }

                if (first.type === 'radio' || type === 'radio') {
                    const radios = namedControls.filter(node => node.type === 'radio');
                    const checked = radios.find(node => node.checked);
                    data[name] = checked ? checked.value : '';
                    continue;
                }

                if (type === 'number') {
                    const cleaned = parseNumericValue(first.value);
                    data[name] = cleaned !== '' ? Number(cleaned) : null;
                } else {
                    data[name] = first.value;
                }
            }
            try {
                let res;
                if (isNew) {
                    res = await fetch(`/api/generic.php?action=insert&table=${encodeURIComponent(table)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                        body: JSON.stringify(data)
                    });
                } else {
                    res = await fetch(`/api/generic.php?action=edit&table=${encodeURIComponent(table)}&id=${encodeURIComponent(id)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                        body: JSON.stringify(data)
                    });
                }
                let result;
                const rawText = await res.text();
                if (!rawText.trim()) {
                    document.getElementById('cms-error').innerText = 'Lỗi: server trả về response rỗng (HTTP ' + res.status + ')';
                    document.getElementById('cms-error').style.display = 'block';
                    setSaveButtonsDisabled(false);
                    return;
                }
                try {
                    result = JSON.parse(rawText);
                } catch (err) {
                    document.getElementById('cms-error').innerText = 'Lỗi phản hồi máy chủ (HTTP ' + res.status + '): ' + rawText.slice(0, 500);
                    document.getElementById('cms-error').style.display = 'block';
                    setSaveButtonsDisabled(false);
                    return;
                }
                    if (result.success) {
                    const parentIdForChild = isNew ? (result.insert_id || '') : id;

                    const childValidation = validateChildRowsBeforeSave();
                    if (!childValidation.ok) {
                        document.getElementById('cms-error').innerText = childValidation.message;
                        document.getElementById('cms-error').style.display = 'block';
                        setSaveButtonsDisabled(false);
                        return;
                    }

                    if (childTableStates.length > 0) {
                        try {
                            // Sync Xinha HTML editors → textarea.value, then re-collect all rows from DOM
                            try { resyncAllChildRowsFromDom(); } catch(e) {}
                            await saveChildTableRows(parentIdForChild);
                        } catch (childErr) {
                            document.getElementById('cms-error').innerText = childErr && childErr.message ? childErr.message : 'Lưu dữ liệu con thất bại';
                            document.getElementById('cms-error').style.display = 'block';
                            setSaveButtonsDisabled(false);
                            return;
                        }
                    }

                    const urlparams = new URLSearchParams(window.location.search);
                    const fromParam = urlparams.get('from');
                    // collect all *_id params from URL and append to redirect
                    const extraParts = [];
                    for (const [k, v] of urlparams.entries()) {
                        if (!/_id$/i.test(k)) continue;
                        extraParts.push(`${encodeURIComponent(k)}=${encodeURIComponent(v)}`);
                    }
                    const extraQs = extraParts.length ? '&' + extraParts.join('&') : '';
                    if (isNew && childTableStates.length > 0 && parentIdForChild) {
                        const nextParams = new URLSearchParams(window.location.search);
                        nextParams.set('id', String(parentIdForChild));
                        window.location.href = 'cms-edit.html?' + nextParams.toString();
                        return;
                    }

                    if (fromParam === 'bus-man') {
                        const to = `bus-man.html?table=${encodeURIComponent(table)}` + extraQs;
                        window.location.href = to;
                    } else {
                        const to = `cms-list.html?table=${encodeURIComponent(table)}` + extraQs;
                        window.location.href = to;
                    }
                } else {
                    document.getElementById('cms-error').innerText = result.message || 'Lưu thất bại';
                    document.getElementById('cms-error').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('cms-error').innerText = 'Lỗi kết nối máy chủ';
                document.getElementById('cms-error').style.display = 'block';
            }
            applyLockedSaveState();
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cms-toasts.js"></script>
    <script src="cms-chat.js"></script>
    <script>
    // Sync a single Xinha editor whose _textArea matches the given element
    function syncXinhaForElement(el) {
        try {
            if (!el || typeof xinha_editors === 'undefined' || !xinha_editors) return;
            var list = Array.isArray(xinha_editors) ? xinha_editors : Object.values(xinha_editors);
            for (var i = 0; i < list.length; i++) {
                var ed = list[i];
                if (ed && ed._textArea === el && typeof ed.synchronize === 'function') {
                    ed.synchronize();
                    return;
                }
            }
        } catch(e) {}
    }

    // Sync ALL active Xinha editors to their underlying textareas
    function syncAllXinhaEditors() {
        try {
            if (typeof xinha_editors === 'undefined' || !xinha_editors) return;
            var list = Array.isArray(xinha_editors) ? xinha_editors : Object.values(xinha_editors);
            list.forEach(function(ed) {
                if (ed && typeof ed.synchronize === 'function') {
                    try { ed.synchronize(); } catch(e) {}
                }
            });
        } catch(e) {}
    }

    // Sync Xinha editors then re-collect every child row from the DOM
    function resyncAllChildRowsFromDom() {
        try { syncAllXinhaEditors(); } catch(e) {}
        if (!Array.isArray(childTableStates)) return;
        childTableStates.forEach(function(state) {
            if (!state || !state.tbody) return;
            var trs = Array.from(state.tbody.querySelectorAll('tr[data-row-index]'));
            trs.forEach(function(tr) {
                try { collectChildRowFromTr(state, tr); } catch(e) {}
            });
        });
    }

    // Initialize Xinha for dynamically created textareas (if Xinha is loaded)
    function initXinhaEditors(scopeRoot) {
        try {
            if (typeof Xinha === 'undefined' || typeof Xinha.makeEditors === 'undefined') return;
            var root = (scopeRoot && typeof scopeRoot.querySelectorAll === 'function') ? scopeRoot : document;
            // Only initialize textareas explicitly marked as formatted by the server.
            // Skip ones already initialized to avoid duplicated Xinha toolbars.
            var tAs = root.querySelectorAll('textarea[data-formatted="1"]:not([data-xinha-initialized="1"])');
            if (!tAs || tAs.length === 0) return;
            var freshTextareas = Array.prototype.slice.call(tAs);
            freshTextareas.forEach(function(ta) {
                ta.setAttribute('data-xinha-initialized', '1');
            });
            // Xinha.makeEditors accepts an array of textarea elements
            var editors = Xinha.makeEditors(freshTextareas, xinha_config || new Xinha.Config(), xinha_plugins || []);
            Xinha.startEditors(editors);
        } catch (e) {
            if (typeof console !== 'undefined' && console.warn) console.warn('Xinha init error', e);
        }
    }
    </script>
    <script>
      // Ensure Xinha only initializes CMS edit fields, not the chat textarea.
      if (typeof xinha_editors === 'undefined' || xinha_editors === null) {
                xinha_editors = '#cms-edit-form textarea[data-formatted="1"], #cms-child-table-area textarea[data-formatted="1"]';
      }
    </script>
    <script src="/xinha/XinhaEasy.js" type="text/javascript"></script>
</body>
